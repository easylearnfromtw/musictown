<body>
<a class="skip-link" href="#main">跳到主要內容</a>
<header class="topbar" id="topbar">
  <div class="topbar__bar glass">
    <button class="icon-btn" type="button" id="tbLeft" aria-label="musicetown 首頁"></button>
    <div class="tb-title"><span class="tb-word">musicetown</span><span class="tb-page" id="tbPage" aria-hidden="true"></span></div>
    <button class="icon-btn" type="button" id="tbRight" aria-label="City Pass 票根"></button>
  </div>
</header>
<main id="main">
  <section class="view" id="view-home" data-view="home" aria-label="探索"></section>
  <section class="view" id="view-cities" data-view="cities" aria-label="城市" hidden></section>
  <section class="view" id="view-search" data-view="search" aria-label="搜尋" hidden></section>
  <section class="view" id="view-library" data-view="library" aria-label="收藏" hidden></section>
  <section class="view" id="view-theme" data-view="theme" hidden></section>
</main>
<nav class="dock" aria-label="主要導覽">
  <div class="mini glass" id="mini">
    <button class="mini__open" type="button" id="miniOpen" aria-label="打開播放器"><span class="mini__disc" id="miniDisc"></span><span class="mini__text"><b id="miniTitle"></b><span id="miniSub"></span></span></button>
    <button class="icon-btn" type="button" id="miniPlay" aria-label="播放"></button>
    <button class="icon-btn" type="button" id="miniNext" aria-label="下一首"></button>
    <span class="mini__progress" id="miniProg" aria-hidden="true"><i></i></span>
  </div>
  <div class="tabbar glass" id="tabbar" role="tablist" aria-label="分頁">
    <div class="tab-lens" id="tabLens" aria-hidden="true"><div class="tab-lens__track" id="tabLensTrack"></div></div>
    <button class="tab" type="button" role="tab" data-tab="home" data-icon="home" aria-selected="true"><span>探索</span></button>
    <button class="tab" type="button" role="tab" data-tab="cities" data-icon="board" aria-selected="false"><span>城市</span></button>
    <button class="tab" type="button" role="tab" data-tab="search" data-icon="search" aria-selected="false"><span>搜尋</span></button>
    <button class="tab" type="button" role="tab" data-tab="library" data-icon="library" aria-selected="false"><span>收藏</span></button>
  </div>
</nav>
<div class="player" id="player" aria-hidden="true" role="dialog" aria-label="播放器"></div>
<div class="cardmodal" id="cardModal" aria-hidden="true">
  <div class="cardmodal__scrim" id="cardModalScrim"></div>
  <button class="icon-btn icon-btn--quiet cardmodal__close" type="button" id="cardModalClose" aria-label="關閉"></button>
  <div class="cardmodal__card" id="cardModalCard" role="dialog" aria-modal="true"></div>
</div>
<div class="sheet-root" id="sheetRoot"></div>
<div class="ticket-modal" id="ticketModal" aria-hidden="true"></div>
<div class="ritual" id="ritual"></div>
<div class="welcome" id="welcome" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
