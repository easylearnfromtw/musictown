name: CITYMUS AUTO · Build 2500 + Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: citymus-production-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate open CJK music supplement
        run: python build_cjk_open_music.py --max-per-language 24 --max-total 60

      - name: Build public-domain CITYMUS Reader
        run: python build_ebooks.py

      - name: Generate City Pass QR assets
        run: python generate_city_pass_qr.py

      - name: Prepare 2500-track Pages artifact
        run: python prepare_audio_site.py

      - name: Verify 2500-track runtime library
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          r=json.load(open("CITYMUS_LIBRARY_REPORT.json",encoding="utf-8"))
          assert r["count"]==2500, r
          p=pathlib.Path("_site/citymus-library.js")
          assert p.exists() and p.stat().st_size>100000
          print("CITYMUS runtime library:",r)
          print("citymus-library.js bytes:",p.stat().st_size)
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
