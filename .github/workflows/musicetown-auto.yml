name: CITYMUS AUTO · Build 4500 + Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: citymus-production-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Require committed 1000 Japanese + 1000 Chinese library
        shell: bash
        run: |
          test -f data/cjk_open_music.generated.json
          python - <<'PY'
          import json
          p=json.load(open("data/cjk_open_music.generated.json",encoding="utf-8"))
          by=p.get("languages",{})
          assert p.get("count")==2000, p.get("count")
          assert by.get("ja")==1000 and by.get("zh")==1000, by
          print("Committed CJK library:",by)
          PY

      - name: Build public-domain CITYMUS Reader
        run: python build_ebooks.py

      - name: Generate City Pass QR assets
        run: python generate_city_pass_qr.py

      - name: Prepare 4500-track Pages artifact
        run: python prepare_audio_site.py

      - name: Verify 4500-track runtime library
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          r=json.load(open("CITYMUS_LIBRARY_REPORT.json",encoding="utf-8"))
          assert r["count"]==4500, r
          assert r["japaneseAdded"]==1000 and r["chineseAdded"]==1000, r
          assert r["languages"].get("ja",0)>=1000 and r["languages"].get("zh",0)>=1000, r
          p=pathlib.Path("_site/citymus-library.js")
          assert p.exists() and p.stat().st_size>500000
          print("CITYMUS runtime library:",r)
          print("citymus-library.js bytes:",p.stat().st_size)
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
