name: R9.3 · Build Real Audio Lyrics

"on":
  workflow_run:
    workflows:
      - "R9.3.14 · 101 themes / 3300 placements · Local Audio Stable Deploy"
    types: [completed]
  push:
    branches: ["main"]
    paths:
      - "transcribe_cc0_lyrics.py"
      - "apply_lyrics_manifest.py"
      - ".github/workflows/build-real-lyrics.yml"
  workflow_dispatch:
    inputs:
      model:
        description: Whisper model
        required: true
        default: "base"
        type: choice
        options: ["base","small"]

permissions:
  contents: write

concurrency:
  group: musicetown-real-lyrics
  cancel-in-progress: true

jobs:
  transcribe:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      WHISPER_MODEL: ${{ inputs.model || 'base' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pin to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Transcribing from $(git rev-parse HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and transcription runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
          python -m pip install "faster-whisper>=1.1,<2"

      - name: Restore verified MP3 cache
        uses: actions/cache@v4
        with:
          path: _master_audio
          key: musicetown-r9313-base-64k-${{ hashFiles('verified_audio_manifest.json') }}
          restore-keys: |
            musicetown-r9313-base-64k-
            musicetown-r920-base-64k-
            musicetown-r910-base-64k-
            musicetown-r890-64k-

      - name: Restore Whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: musicetown-whisper-${{ env.WHISPER_MODEL }}-v1
          restore-keys: |
            musicetown-whisper-${{ env.WHISPER_MODEL }}-

      - name: Restore 250 verified local audio slots
        run: python fetch_verified_audio.py --bitrate 64k

      - name: Transcribe 114 unique CC0 masters
        run: python transcribe_cc0_lyrics.py --model "$WHISPER_MODEL"

      - name: Apply real timestamped lyrics to 3300 placements
        run: python apply_lyrics_manifest.py

      - name: Summarize transcription
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("lyrics_manifest.json")
          d=json.loads(p.read_text())
          print("MODEL", d.get("model"))
          print("SUMMARY", json.dumps(d.get("summary",{}), ensure_ascii=False))
          masters=d.get("masters",{})
          lines=sum(len(v.get("syncedLyrics",[])) for v in masters.values())
          print("TIMED LYRIC LINES", lines)
          PY

      - name: Re-apply lyrics onto latest main
        run: |
          cp lyrics_manifest.json /tmp/musicetown-lyrics-manifest.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/musicetown-lyrics-manifest.json lyrics_manifest.json
          python apply_lyrics_manifest.py

      - name: Persist lyrics to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982774+github-actions[bot]@users.noreply.github.com"
          git add lyrics_manifest.json index.html 404.html
          if git diff --cached --quiet; then
            echo "No lyrics changes to persist."
          else
            git commit -m "Add real audio-transcribed synced lyrics [skip ci]"
            git push origin HEAD:main
          fi
