name: R9.3.14 · 101 themes / 3300 placements · Local Audio Stable Deploy

"on":
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "fresh_city_profiles.json"
      - "theme_profiles.json"
      - "limited_theme_profiles.json"
      - "build_audited_release_packs.py"
      - "build_limited_theme_packs.py"
      - "restore_verified_local_audio.py"
      - "fetch_verified_audio.py"
      - "verified_audio_manifest.json"
      - "apply_r937_ux.py"
      - "r937_ux.js"
      - "r937_ux.css"
      - "verify_music_install.py"
      - "prepare_audio_site.py"
      - ".github/workflows/install-1150-music-and-deploy.yml"

permissions:
  contents: write

concurrency:
  group: musicetown-r9313-local-audio
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pin build to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Building $(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg + Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt

      - name: Restore verified MP3 cache
        uses: actions/cache@v4
        with:
          path: _master_audio
          key: musicetown-r9313-base-64k-${{ hashFiles('verified_audio_manifest.json') }}
          restore-keys: |
            musicetown-r9313-base-64k-
            musicetown-r920-base-64k-
            musicetown-r910-base-64k-
            musicetown-r890-64k-

      - name: Build 250 verified local base tracks
        run: python fetch_verified_audio.py --bitrate 64k

      - name: Restore catalog to local verified MP3 paths
        run: python restore_verified_local_audio.py

      - name: Verify deployed audio integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          roots=[Path(x) for x in ("jazz","crooner","rock","sport","lo-fi")]
          files=[p for r in roots for p in r.glob("*.mp3")]
          bad=[p for p in files if p.stat().st_size < 20000]
          target=Path("rock/008.mp3")
          if not target.is_file() or target.stat().st_size < 20000:
              raise SystemExit("Bravery Vampire audio missing or invalid: rock/008.mp3")
          if len(files) != 250:
              raise SystemExit(f"Expected 250 verified base MP3s, found {len(files)}")
          if bad:
              raise SystemExit("Invalid/suspicious MP3 files: "+", ".join(map(str,bad[:12])))
          print(f"Audio integrity OK: {len(files)} MP3s; rock/008.mp3={target.stat().st_size} bytes")
          PY

      - name: Build 31 audited core and city themes deterministically
        run: python build_audited_release_packs.py

      - name: Build 70 limited 25-track themes
        run: python build_limited_theme_packs.py

      - name: Apply cached real lyrics manifest
        run: |
          if [ -f lyrics_manifest.json ]; then
            python apply_lyrics_manifest.py
          else
            echo "No lyrics manifest yet; continuing without fabricated lyrics."
          fi

      - name: Apply R9.3 UX layer
        run: python apply_r937_ux.py

      - name: Verify 101-theme / 3300-placement catalog
        run: python verify_music_install.py

      - name: Persist stable 3300-placement catalog to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html
          if git diff --cached --quiet; then
            echo "Stable catalog already persisted."
          else
            git commit -m "Persist stable local-audio 3300 catalog [skip ci]"
            git push origin HEAD:main
          fi
