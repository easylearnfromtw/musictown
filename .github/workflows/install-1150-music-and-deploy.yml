name: R9.3 FINAL · 101 themes / 3300 placements · Fast Hybrid Deploy

"on":
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "fresh_city_profiles.json"
      - "theme_profiles.json"
      - "limited_theme_profiles.json"
      - "build_fresh_city_packs.py"
      - "build_theme_packs.py"
      - "build_limited_theme_packs.py"
      - "resolve_verified_audio_streams.py"
      - "verified_audio_manifest.json"
      - "fetch_verified_audio.py"
      - "verify_music_install.py"
      - "prepare_audio_site.py"
      - "index.html"
      - "404.html"
      - ".github/workflows/install-1150-music-and-deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: musicetown-r93-hybrid-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pin build to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Building $(git rev-parse HEAD)"

      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: python -m pip install -r requirements.txt

      - name: Restore audited stream URL cache
        uses: actions/cache@v4
        with:
          path: _resolved_verified_streams.json
          key: musicetown-r93-stream-map-${{ hashFiles('verified_audio_manifest.json') }}

      - name: Resolve audited base 5 to verified HTTPS streams
        run: python resolve_verified_audio_streams.py


      - name: Curate 9 core music themes as verified streams
        run: python build_theme_packs.py --per-theme 50 --streaming

      - name: Curate 22 city themes as verified streams
        run: python build_fresh_city_packs.py --per-city 50 --streaming

      - name: Build 70 limited 25-track themes
        run: python build_limited_theme_packs.py

      - name: Verify 101-theme / 3300-placement hybrid catalog
        run: python verify_music_install.py

      - name: Prepare lightweight Pages artifact
        run: python prepare_audio_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
