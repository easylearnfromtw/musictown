name: R9.2 · 52 themes / 1875 placements · Hybrid Deploy

"on":
  workflow_dispatch:
    inputs:
      bitrate:
        description: Base 5 local MP3 bitrate
        required: true
        default: "64k"
        type: choice
        options: ["48k","64k","80k"]
  push:
    branches: ["main"]
    paths:
      - "fresh_city_profiles.json"
      - "theme_profiles.json"
      - "limited_theme_profiles.json"
      - "build_fresh_city_packs.py"
      - "build_theme_packs.py"
      - "build_limited_theme_packs.py"
      - "verify_music_install.py"
      - "prepare_audio_site.py"
      - "index.html"
      - "404.html"
      - ".github/workflows/install-1150-music-and-deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: musicetown-hybrid-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BASE_BITRATE: ${{ inputs.bitrate || '64k' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg + Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt

      - name: Restore base audio cache
        uses: actions/cache@v4
        with:
          path: _master_audio
          key: musicetown-r920-base-${{ env.BASE_BITRATE }}-${{ hashFiles('verified_audio_manifest.json') }}
          restore-keys: |
            musicetown-r920-base-${{ env.BASE_BITRATE }}-

      - name: Install base 5 local collections
        run: python fetch_verified_audio.py --bitrate "$BASE_BITRATE"

      - name: Curate 14 city themes as verified streams
        run: python build_fresh_city_packs.py --per-city 50 --streaming

      - name: Curate 4 music themes as verified streams
        run: python build_theme_packs.py --per-theme 50 --streaming

      - name: Build 29 limited 25-track themes
        run: python build_limited_theme_packs.py

      - name: Verify 52-theme hybrid catalog
        run: python verify_music_install.py

      - name: Prepare sub-1GB Pages artifact
        run: python prepare_audio_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
