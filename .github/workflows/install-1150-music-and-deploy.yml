name: R9.3.14 · 101 themes / 3300 placements · Local Audio Stable Deploy

"on":
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "fresh_city_profiles.json"
      - "theme_profiles.json"
      - "limited_theme_profiles.json"
      - "build_audited_release_packs.py"
      - "build_limited_theme_packs.py"
      - "restore_verified_local_audio.py"
      - "fetch_verified_audio.py"
      - "verified_audio_manifest.json"
      - "apply_r937_ux.py"
      - "r937_ux.js"
      - "r937_ux.css"
      - "apply_r10_core.py"
      - "apply_r10_ux.py"
      - "r10_ux.js"
      - "r10_ux.css"
      - "verify_music_install.py"
      - "prepare_audio_site.py"
      - ".github/workflows/install-1150-music-and-deploy.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: musicetown-r9313-local-audio
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pin build to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Building $(git rev-parse HEAD)"

      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg + Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt

      - name: Restore verified MP3 cache
        uses: actions/cache@v4
        with:
          path: _master_audio
          key: musicetown-r9313-base-64k-${{ hashFiles('verified_audio_manifest.json') }}
          restore-keys: |
            musicetown-r9313-base-64k-
            musicetown-r920-base-64k-
            musicetown-r910-base-64k-
            musicetown-r890-64k-

      - name: Build 250 verified local base tracks
        run: python fetch_verified_audio.py --bitrate 64k

      - name: Verify critical mobile audio
        run: |
          python - <<'PY'
          from pathlib import Path
          roots=[Path(x) for x in ("jazz","crooner","rock","sport","lo-fi")]
          files=[p for r in roots for p in r.glob("*.mp3")]
          bad=[p for p in files if p.stat().st_size < 20000]
          target=Path("rock/008.mp3")
          if not target.is_file() or target.stat().st_size < 20000:
              raise SystemExit("Bravery Vampire audio missing or invalid: rock/008.mp3")
          if len(files) != 250:
              raise SystemExit(f"Expected 250 verified base MP3s, found {len(files)}")
          if bad:
              raise SystemExit("Invalid/suspicious MP3 files: "+", ".join(map(str,bad[:12])))
          print(f"Audio integrity OK: {len(files)} MP3s; rock/008.mp3={target.stat().st_size} bytes")
          PY

      - name: Restore catalog to local verified MP3 paths
        run: python restore_verified_local_audio.py

      - name: Build 31 audited core and city themes deterministically
        run: python build_audited_release_packs.py

      - name: Build 70 limited 25-track themes
        run: python build_limited_theme_packs.py

      - name: Apply cached real lyrics manifest
        run: |
          if [ -f lyrics_manifest.json ]; then
            python apply_lyrics_manifest.py
          else
            echo "No lyrics manifest yet; continuing without fabricated lyrics."
          fi

      - name: Install R10.2 core bridge
        run: python apply_r10_core.py

      - name: Apply R9.3 UX layer + R10.2 Flow / recommendations shell
        run: python apply_r937_ux.py

      - name: Verify R10.2.2 interaction contract
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("index.html","404.html"):
              s=Path(name).read_text(encoding="utf-8")
              required=[
                  "version:'R10.2.2'",
                  "function sceneSafeBand()",
                  "musicetown.r10.2.2.badAudio",
                  "r10-ux-layer",
                  "每日推薦",
                  "每週推薦",
                  "MT 推薦榜",
                  "mt-lyrics-preview",
                  "musicetown.r10.2.2.onboarded",
              ]
              missing=[x for x in required if x not in s]
              if missing:
                  raise SystemExit(f"{name}: missing R10.2.2 markers: {missing}")
              if "ONLINE SOURCE" in s or "ONLINE CC0 PLAYER" in s:
                  raise SystemExit(f"{name}: legacy online-source fallback still present")
          print("R10.2.2 interaction contract OK")
          PY

      - name: Verify 101-theme / 3300-placement catalog
        run: python verify_music_install.py

      - name: Persist stable 3300-placement catalog to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html
          if git diff --cached --quiet; then
            echo "Stable catalog already persisted."
          else
            git commit -m "Persist stable local-audio 3300 catalog [skip ci]"
            if ! git push origin HEAD:main; then
              echo "main advanced during the build; rebasing generated catalog once…"
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Generated catalog rebased and persisted."
              else
                git rebase --abort 2>/dev/null || true
                echo "Generated catalog persistence skipped because main changed again; continuing Pages deploy with the verified build artifact."
              fi
            fi
          fi

      - name: Prepare Pages artifact with local audio
        run: python prepare_audio_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}