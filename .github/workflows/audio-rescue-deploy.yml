name: R9.3 · Audio Rescue + UX Deploy

"on":
  push:
    branches: ["main"]
  workflow_run:
    workflows:
      - "R9.3 · Build Real Audio Lyrics"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: musicetown-audio-rescue
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pin rescue deploy to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Rescuing $(git rev-parse HEAD)"

      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Restore base audio cache
        uses: actions/cache@v4
        with:
          path: _master_audio
          key: musicetown-base-64k-${{ hashFiles('verified_audio_manifest.json') }}
          restore-keys: |
            musicetown-base-64k-
            musicetown-r9313-base-64k-
            musicetown-r920-base-64k-
            musicetown-r910-base-64k-
            musicetown-r890-64k-
      - name: Build base 5 local audio folders
        run: python fetch_verified_audio.py --bitrate "64k"
      - name: Prepare current 101-theme site with audio
        run: python prepare_audio_site.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
