name: R9.3 · Audio Rescue + UX Deploy

"on":
  push:
    branches: ["main"]
  workflow_run:
    workflows:
      - "R9.3 · Build Real Audio Lyrics"
      - "pages build and deployment"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: musicetown-audio-rescue
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pin rescue deploy to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Rescuing $(git rev-parse HEAD)"

      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Restore base audio cache
        uses: actions/cache@v4
        with:
          path: _master_audio
          key: musicetown-base-64k-${{ hashFiles('verified_audio_manifest.json') }}
          restore-keys: |
            musicetown-base-64k-
            musicetown-r9313-base-64k-
            musicetown-r920-base-64k-
            musicetown-r910-base-64k-
            musicetown-r890-64k-
      - name: Build base 5 local audio folders
        run: python fetch_verified_audio.py --bitrate "64k"

      - name: Verify deployed audio integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          roots=[Path(x) for x in ("jazz","crooner","rock","sport","lo-fi")]
          files=[p for r in roots for p in r.glob("*.mp3")]
          bad=[p for p in files if p.stat().st_size < 20000]
          target=Path("rock/008.mp3")
          if not target.is_file() or target.stat().st_size < 20000:
              raise SystemExit("Bravery Vampire audio missing or invalid: rock/008.mp3")
          if len(files) != 250:
              raise SystemExit(f"Expected 250 verified base MP3s, found {len(files)}")
          if bad:
              raise SystemExit("Invalid/suspicious MP3 files: "+", ".join(map(str,bad[:12])))
          print(f"Audio integrity OK: {len(files)} MP3s; rock/008.mp3={target.stat().st_size} bytes")
          PY
      - name: Apply current UX source layer
        run: python apply_r937_ux.py

      - name: Prepare current 101-theme site with audio
        run: python prepare_audio_site.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # This repository still has the legacy branch-based Pages source enabled.
      # That dynamic Pages run does not contain generated MP3 folders and can
      # overwrite the audio artifact if it finishes a few seconds later.
      # Wait for the competing branch deployment for the exact checked-out SHA,
      # then deploy the audio artifact last.
      - name: Wait for branch Pages build to settle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "Waiting for legacy branch Pages run for $sha to finish before audio deploy..."
          for i in $(seq 1 30); do
            busy="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs"               -f head_sha="$sha" -f per_page=100               --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')"
            echo "branch-pages busy=$busy (check $i/30)"
            if [ "$busy" = "0" ]; then
              break
            fi
            sleep 8
          done

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
