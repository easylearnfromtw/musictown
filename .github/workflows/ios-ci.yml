name: CITYMUS iOS Companion CI

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citymus-ios-ci
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare App Icon
        run: bash ios/scripts/prepare_assets.sh

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build iOS Simulator
        working-directory: ios
        run: |
          xcodebuild \
            -project CITYMUS.xcodeproj \
            -scheme CITYMUS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Xcode project
        run: |
          ditto -c -k --sequesterRsrc --keepParent ios CITYMUS-iOS-Companion.zip

      - name: Upload Xcode project artifact
        uses: actions/upload-artifact@v4
        with:
          name: CITYMUS-iOS-Companion
          path: CITYMUS-iOS-Companion.zip
          if-no-files-found: error
          retention-days: 14
