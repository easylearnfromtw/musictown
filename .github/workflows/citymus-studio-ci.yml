name: CITYMUS Studio backend tests
on:
  push:
    paths:
      - 'api/config.js'
      - 'api/playlists.js'
      - 'api/integrations.js'
      - 'api/public-playlist.js'
      - 'api/embed.js'
      - 'lib/citymus-backend.js'
      - 'tests/**'
      - '.github/workflows/citymus-studio-ci.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'lib/**'
      - 'tests/**'
      - '.github/workflows/citymus-studio-ci.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Node.js syntax
        run: |
          node --check lib/citymus-backend.js
          node --check api/config.js
          node --check api/playlists.js
          node --check api/integrations.js
          node --check api/public-playlist.js
          node --check api/embed.js
          node --check studio/embed-player.js
          node --check tests/citymus-backend.test.js
      - name: Run backend tests
        run: node --test tests/*.test.js
