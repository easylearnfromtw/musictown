name: Finalize PWA Home Screen artwork
on:
  push:
    branches: [main]
    paths:
      - "icon-192.png"
      - ".github/workflows/finalize-home-icon.yml"
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - name: Build exact icon family from the approved artwork
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open("icon-192.png").convert("RGBA")
          targets=[
              ("favicon-32.png",32),
              ("assets/icons/apple-touch-icon-120.png",120),
              ("assets/icons/apple-touch-icon-152.png",152),
              ("assets/icons/apple-touch-icon-167.png",167),
              ("apple-touch-icon.png",180),
              ("icon-512.png",512),
              ("icon-maskable-512.png",512),
          ]
          for path,size in targets:
              p=Path(path); p.parent.mkdir(parents=True,exist_ok=True)
              src.resize((size,size),Image.Resampling.LANCZOS).save(p,optimize=True)
          PY
      - name: Bust service worker icon cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ("sw.js","design-src/src/sw.js"):
              p=Path(name)
              s=p.read_text(encoding="utf-8")
              s=re.sub(r"const VERSION = '[^']+';", "const VERSION = 'R11.6-2026-10-03-HOMEICON-FINAL';", s, count=1)
              p.write_text(s,encoding="utf-8")
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/finalize-home-icon.yml
          git config user.name "musicetown bot"
          git config user.email "actions@users.noreply.github.com"
          git add favicon-32.png apple-touch-icon.png assets/icons/apple-touch-icon-120.png assets/icons/apple-touch-icon-152.png assets/icons/apple-touch-icon-167.png icon-512.png icon-maskable-512.png sw.js design-src/src/sw.js .github/workflows/finalize-home-icon.yml
          git commit -m "Finalize MUSICTOWN PWA Home Screen artwork"
          git push
