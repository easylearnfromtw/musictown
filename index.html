  const ref = t => { for (let gi = 0; gi < LIB_REF_THEMES.length; gi++) { const th = THEME_BY_T.get(LIB_REF_THEMES[gi]); if (!th) continue; const ti = th.tracks.findIndex(x => x.shareId === t.shareId); if (ti < 0 || ti >= 1296) continue; return gi.toString(36) + ti.toString(36).padStart(2, '0'); } return ''; };
  const fromRef = r => { if (!/^[0-9a-z]{3}$/i.test(r)) return null; const th = THEME_BY_T.get(LIB_REF_THEMES[parseInt(r[0], 36)]); return th?.tracks?.[parseInt(r.slice(1), 36)] || null; };
  const libUrl = (name, list) => shareBase({ hash: `library=L2.${b64urlEncode({ n: String(name || 'CITYMUS LIBRARY').slice(0, 40) })}.${[...new Set(list.map(ref).filter(Boolean))].join('')}` });
  function libraryPass(lib) {
    const list = Library.resolve(lib).filter(t => t.shareId); if (!list.length) { toast('這個收藏還沒有可分享的歌'); return; }
    const url = libUrl(lib.name, list); const locals = LocalFiles.tracks(lib.id).length;
    PassSheet.open({
      label: 'Library Pass',
      html: `<article class="pass pass--library"><i class="pass__dots" aria-hidden="true"></i><div class="pass__inner">
        ${PassSheet.head('LIBRARY PASS', '<span class="pass__live">SHAREABLE SNAPSHOT</span>')}
        <p class="pass__eyebrow pass__center">PERSONAL SOUND ARCHIVE</p>
        <h2 class="pass__big">${esc(lib.name)}</h2>
        <p class="pass__meta">${list.length} TRACKS · CITYMUS SNAPSHOT</p>
        ${PassSheet.rows(list.slice(0, 8))}${list.length > 8 ? `<p class="pass__more">＋ ${list.length - 8} 首</p>` : ''}
        <div class="pass__qr"><div class="pass__qrbox">${QR.svg(url, { ecl: 'M', fg: '#29465D' })}<span class="pass__qrlogo">${globeMark()}</span></div><small class="pass__label">SCAN TO OPEN</small></div>
        <div class="pass__fields pass__fields--2"><i class="pass__notch"></i><div><small>FORMAT</small><b>LIBRARY PASS</b></div><div><small>ACCESS</small><b>VIEW · PLAY · SAVE</b></div><div><small>LOCAL FILES</small><b>${locals ? 'NOT INCLUDED' : 'NONE'}</b></div><div><small>TRACKS</small><b>${list.length}</b></div></div>
        <p class="pass__note">這張票根是一個當下快照：掃碼的人可以查看、播放、另存成自己的音樂庫。之後你在這台裝置的增刪不會改動已分享的票根，本機音樂不會被分享。</p>
      </div></article>`,
      actions: `<button class="pbtn pbtn--primary pbtn--wide" type="button" data-n>${icon('share')}<span>SHARE PASS</span></button><button class="pbtn" type="button" data-c aria-label="複製連結">${icon('link')}</button>`,
      mount(sheet) {
        $('[data-n]', sheet).onclick = () => nativeShare({ title: `musicetown · ${lib.name}`, text: `${lib.name} · ${list.length} 首 · Library Pass`, url });
        $('[data-c]', sheet).onclick = async () => { await copyText(url); toast('已複製 Library Pass 連結'); };
        $$('.pass__rows li', sheet).forEach(li => li.onclick = () => { PassSheet.close(); Player.playList(list, Number(li.dataset.i), { kind: 'library', title: lib.name }); });
      }
    });
  }

  /* ---------- receivers: the ticket page with the drifting QR strip ---------- */
  function received({ kind, title, meta, list, url, saveLabel = '存成收藏', onSave }) {
    const th = themeOf(list[0]);
    PassSheet.open({
      accent: th, label: title,
      html: `<article class="pass pass--received">${PassSheet.marquee(url, `CITYMUS · ${kind}`)}<div class="pass__inner">
        ${PassSheet.head(`${kind} · RECEIVED`)}
        <p class="pass__eyebrow">SOMEONE SHARED THIS WITH YOU</p>
        <h2 class="pass__big pass__big--left">${esc(title)}</h2>
        <p class="pass__meta pass__meta--left">${esc(meta)}</p>
        ${PassSheet.rows(list)}
        <footer class="pass__foot"><small class="pass__label">CITYMUS · CITY SOUND ARCHIVE</small><div><p>所有曲目都來自標示 CC0、CC 授權或公有領域的來源。</p><b>musicetown</b></div></footer>
      </div></article>`,
      actions: `<button class="pbtn pbtn--primary" type="button" data-p>${icon('play')}<span>播放</span></button><button class="pbtn" type="button" data-s aria-label="${esc(saveLabel)}">${icon('listAdd')}</button><button class="pbtn" type="button" data-d aria-label="存到這台裝置">${icon('download')}</button>`,
      mount(sheet, api) {
        $('[data-p]', sheet).onclick = () => { api.close(); Player.playList(list, 0, { kind: 'mix', title }); };
        $('[data-s]', sheet).onclick = () => { onSave(); haptic('success'); };
        $('[data-d]', sheet).onclick = () => Offline.downloadMany(list, title);
        $$('.pass__rows li', sheet).forEach(li => li.onclick = () => { api.close(); Player.playList(list, Number(li.dataset.i), { kind: 'mix', title }); });
      }
    });
  }
  function receiveMix(p) {
    const list = (p?.ids || []).map(id => TRACK_BY_SHARE.get(id)).filter(Boolean); if (!list.length) return;
    const title = p.title || '分享的歌單';
    received({ kind: 'SHARED MIX', title, meta: `${list.length} TRACKS · SHARED MIX`, list, url: location.href, onSave: () => { const l = Library.create(title, list.map(trackKey), false); toast(`已存成「${l.name}」`); } });
  }
  function receiveTrack(id) {
    const t = TRACK_BY_SHARE.get(id); if (!t) return;
    const th = themeOf(t);
    received({ kind: 'SHARED TRACK', title: t.title, meta: `${t.artist || ''}${th ? ` · ${th.kind === 'literature' ? th.cn : th.name}` : ''}`, list: [t], url: location.href, saveLabel: '加入收藏', onSave: () => { if (!Library.isFav(t)) toggleFav(t); else toast('已在收藏裡'); } });
  }
  function receiveLibrary(m) {
    const name = b64urlDecode(m[1])?.n || 'SHARED LIBRARY'; const raw = m[2] || ''; const refs = []; for (let i = 0; i + 2 < raw.length; i += 3) refs.push(raw.slice(i, i + 3));
    const list = refs.map(fromRef).filter(Boolean); if (!list.length) return;
    received({ kind: 'LIBRARY PASS', title: Library.clean(name) || 'Library Pass', meta: `${list.length} TRACKS · LIBRARY PASS`, list, url: location.href, onSave: () => { const l = Library.create(name, list.map(trackKey), true); toast(`已建立「${l.name}」`); } });
  }
  function readHash() {
    const h = location.hash;
    const lib = h.match(/^#library=L2\.([A-Za-z0-9_-]+)\.([0-9a-z]*)$/i);
    if (lib) receiveLibrary(lib);
    else if (/^#t=/.test(h)) receiveTrack(decodeURIComponent(h.slice(3)));
    else { const mix = h.match(/^#mix=(.+)$/); if (mix) { const p = b64urlDecode(mix[1]); if (p) receiveMix(p); } else return false; }
    try { history.replaceState(history.state, '', location.pathname + location.search); } catch (_) {}
    return true;
  }
  window.addEventListener('hashchange', readHash);
  return { theme, tracks, track, libraryPass, readHash };
})();

/* ---- 78-welcome.js ---- */
/* ==========================================================================
   Welcome · skippable, and the city you're in comes first
   ========================================================================== */
const Welcome = (() => {
  const el = byId('welcome'); let tab = 'city', isOpen = false;
  function render() {
    el.innerHTML = `<button class="welcome__skip glass" type="button" data-skip>略過</button>
    <section class="welcome__step is-active" data-step="1">
      <div class="welcome__globe">${globeMark()}</div>
      <p class="welcome__word">musicetown</p>
      <h1 class="welcome__title welcome__title--brand"><img src="assets/citymus-wordmark.png" alt="CITYMUS"></h1>
      <p class="welcome__lede">顛簸、晃蕩、恍惚時，用CITYMUS緩解相思</p>
      <div class="welcome__cta"><button class="btn btn--primary" type="button" data-next>選一個目的地</button><button class="btn btn--glass" type="button" data-skip>直接進入</button></div>
    </section>
    <section class="welcome__step" data-step="2">
      <h2 class="welcome__h2">先去哪裡？</h2>
      <p class="welcome__sub">選一個開始，之後隨時可以從首頁換。</p>
      <div class="near" id="wNear"></div>
      <div id="wSeg"></div>
      <div class="choices" id="wChoices"></div>
      <p class="welcome__privacy">我們用連線位置估算你所在的城市，只用來排序與開放城市票根，不會儲存你的 IP。</p>
    </section>`;
    el.addEventListener('click', onClick);
    Seg(byId('wSeg'), { label: '分類', value: tab, items: [{ key: 'city', label: '城市' }, { key: 'literature', label: '文學' }, { key: 'style', label: '風格' }, { key: 'mood', label: '心情' }], onChange: k => { tab = k; drawChoices(); } });
    drawNear(); drawChoices();
  }
  function drawNear() {
    const host = byId('wNear'); if (!host) return;
    const th = Geo.theme ? THEME_BY_T.get(Geo.theme) : null;
    if (th) host.innerHTML = `<button class="near__card" type="button" data-slug="${th.slug}"><b>${esc(th.code)}</b><span style="min-width:0"><strong>你在${esc(th.cityCn)} · ${esc(th.name)}</strong><span>城市限定 · 進入就能領取票根</span></span>${icon('chevron')}</button>`;
    else if (!Geo.resolved) host.innerHTML = `<p class="near__status"><i class="dotpulse"></i>正在確認你所在的城市⋯</p>`;
    else host.innerHTML = '';
  }
  function drawChoices() {
    const host = byId('wChoices'); if (!host) return;
    let list = THEMES.filter(t => t.kind === tab && t.tracks.length);
    if (tab === 'city' && Geo.theme) list = list.sort((a, b) => (b.t === Geo.theme) - (a.t === Geo.theme));
    host.innerHTML = list.map(th => `<button class="choice${th.t === Geo.theme ? ' is-here' : ''}" type="button" data-slug="${th.slug}"><em>${esc(th.code)}</em><span><b>${esc(th.kind === 'literature' ? th.cn : th.name)}</b><span>${esc(th.kind === 'literature' ? th.authorCn : th.cn)}${th.kind === 'city' ? ' · ' + esc(localTimeIn(th.tz)) : ''}</span></span></button>`).join('');
  }
  function onClick(e) {
    if (e.target.closest('[data-skip]')) { haptic(); close(); return; }
    if (e.target.closest('[data-next]')) { haptic(); $$('.welcome__step', el).forEach(s => s.classList.toggle('is-active', s.dataset.step === '2')); el.scrollTo(0, 0); return; }
    const c = e.target.closest('[data-slug]'); if (c) { haptic('success'); const slug = c.dataset.slug; close(() => Router.go('theme', { slug })); }
  }
  function open() {
    if (isOpen) return; isOpen = true; el.hidden = false; el.classList.remove('is-leaving'); render(); scrollLock.lock(); Geo.ensure();
  }
  function close(after) {
    if (!isOpen) return; isOpen = false; Settings.set('onboarded', true);
    el.classList.add('is-leaving'); scrollLock.unlock(); after && after();
    setTimeout(() => { el.hidden = true; el.innerHTML = ''; el.removeEventListener('click', onClick); }, 520);
  }
  bus.on('geo', () => { if (isOpen) { drawNear(); drawChoices(); } });
  return { open, close, get isOpen() { return isOpen; } };
})();

/* ==========================================================================
   Ritual · Bluetooth audio route (from the native iOS shell) + output info
   Contract kept: window event `musicetown:bluetooth-audio`,
   webkit.messageHandlers.musicetownReady, ?previewAudioLink=1
   ========================================================================== */
const Ritual = (() => {
  const el = byId('ritual'); let connected = false, timer = null;
  function open({ auto = false, preview = false } = {}) {
    const t = Player.current, th = t ? themeOf(t) : null;
    setAccent(el, th);
    el.innerHTML = `<div class="ritual__scrim"></div><div class="ritual__card glass" role="dialog" aria-label="音訊輸出"><div class="buds"><i class="bud bud--l"></i><i class="buds__ring"></i><i class="buds__ring"></i><i class="bud bud--r"></i></div>
      <h3>${connected || preview ? '耳機已連上' : '音訊輸出'}</h3><p>${connected || preview ? '聲音已切到 Bluetooth 音訊，唱片和耳機現在在同一條線上。' : '輸出裝置由系統管理。在 iPhone 控制中心可以切換 AirPods 或 AirPlay 喇叭。'}</p>
      ${t ? `<div class="ritual__np"><b>${esc(t.title)}</b> · ${esc(t.artist || '')}</div>` : ''}<button class="btn btn--block mt-16" type="button" data-x>完成</button></div>`;
    el.classList.remove('is-open'); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('is-open')));
    if (connected || preview) haptic('success');
    el.querySelector('[data-x]').onclick = close; el.querySelector('.ritual__scrim').onclick = close;
    clearTimeout(timer); if (auto) timer = setTimeout(close, 4600);
  }
  function close() { clearTimeout(timer); el.classList.remove('is-open'); setTimeout(() => { if (!el.classList.contains('is-open')) el.innerHTML = ''; }, 500); }
  window.addEventListener('musicetown:bluetooth-audio', e => {
    const d = e?.detail || {}; const was = connected; connected = d.connected === true;
    if (connected && !was) open({ auto: true });
    if (!connected && el.classList.contains('is-open')) close();
  });
  window.addEventListener('load', () => setTimeout(() => { try { window.webkit?.messageHandlers?.musicetownReady?.postMessage({ ready: true }); } catch (_) {} }, 80));
  return { open, close, output: () => open({ auto: false }) };
})();

/* ---- 90-boot.js ---- */
/* ==========================================================================
   Boot
   ========================================================================== */
(function boot() {
  const q = new URLSearchParams(location.search);
  const deep = q.has('theme') || location.hash.length > 1 || q.has('previewCityPass') || q.has('previewLibraryPass') || q.has('previewAudioLink') || q.has('previewMonthly') || q.has('limited');
  Router.start();
  Player.restore();
  Mini.render();
  if (!Settings.get('onboarded') && !deep) Welcome.open(); else Geo.ensure();
  Share.readHash();
  setTimeout(() => Pass.autoHiddenSpot?.(), 1800);
  const monthlyDue = MonthlyTracker.issueDue();
  if (q.get('previewMonthly') === '1') setTimeout(() => MonthlyPass.open(MonthlyTracker.preview()), 650);
  else if (monthlyDue) setTimeout(() => {
    if (!Welcome.isOpen && !Sheet.isOpen && !PassSheet.isOpen) MonthlyPass.open(monthlyDue);
    else toast(monthlyDue.monthLabel + '聆聽月報已生成', { action: '查看', ms: 6500, onAction: () => MonthlyPass.open(monthlyDue) });
  }, 2600);

  // design previews (kept from R8.x)
  const pv = q.get('previewCityPass');
  if (pv) {
    const th = themeBySlug(pv) || THEME_BY_SLUG.get(norm(pv).replace(/\s+/g, '-'));
    if (th) { Geo.preview(th.t); Router.go('theme', { slug: th.slug }, { replace: true }); setTimeout(() => Pass.openTicket(Pass.issueCity(th, 'IP')), 420); }
  }
  if (q.get('previewLibraryPass') === '1') {
    const th = THEME_BY_T.get('TAIPEI DREAM') || THEMES.find(t => t.tracks.length);
    setTimeout(() => Share.libraryPass({ name: 'After Rain in Taipei', keys: th.tracks.slice(0, 8).map(trackKey) }), 500);
  }
  if (q.get('previewAudioLink') === '1') setTimeout(() => Ritual.open({ preview: true }), 600);

  // one gentle add-to-home-screen hint for returning iPhone visitors
  if (IS_IOS && !STANDALONE && VISITS >= 2 && !Settings.get('a2hsDismissed')) {
    setTimeout(() => {
      if (Welcome.isOpen || Sheet.isOpen) return;
      Settings.set('a2hsDismissed', true);
      toast('加入主畫面，像 App 一樣使用', { action: '怎麼做', ms: 6000, onAction: () => Sheet.open({ title: '加入主畫面', sub: '全螢幕開啟，鎖定畫面也能控制播放',
        html: `<div class="a2hs"><img src="apple-touch-icon.png" alt=""><div><b>1 · 點 Safari 下方的 ${icon('share')}</b><p>在分享選單往下捲。</p></div></div><div class="a2hs mt-8"><img src="apple-touch-icon.png" alt=""><div><b>2 · 選「加入主畫面」</b><p>主畫面會出現 musicetown 的圖示；從那裡打開，下載的歌會穩定保留，沒有網路也能聽。</p></div></div>` }) });
    }, 9000);
  }

  document.documentElement.classList.add('is-ready');
})();

/* small public handle for debugging and the native shell */
window.musicetown = Object.freeze({ version: MT_BUILD, Player, Reco, Settings, FX, Geo, Pass, MonthlyTracker, MonthlyPass, Router, Drawer, Offline, Artwork, Limited, Share });

})();
</script>
