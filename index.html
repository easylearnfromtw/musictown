/* ==========================================================================
   musicetown R11 · design system
   The R8 identity, refined: Archivo for codes and labels, EB Garamond for
   names and titles, Noto Serif TC for Chinese. White paper, sky, blush,
   lavender and the pass teal; indigo for the one primary action.
   Liquid glass only on navigation and controls; content stays opaque.
   ========================================================================== */
@layer reset, tokens, base, components, views, overlays, utilities;

@layer reset {
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body, h1, h2, h3, h4, p, figure, ul, ol { margin: 0; }
  ul, ol { padding: 0; list-style: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  a { color: inherit; -webkit-tap-highlight-color: transparent; }
  img, svg, canvas { display: block; max-width: 100%; }
  [hidden] { display: none !important; }
}

@layer tokens {
  :root {
    --porcelain: #F6F8FC;
    --paper: #FFFFFF;
    --mist: #EEF2F8;
    --ink: #2F3654;
    --ink-2: #5E6480;
    --ink-3: #8E93AA;
    --line: rgba(47, 54, 84, .085);
    --line-2: rgba(47, 54, 84, .15);
    --sky: #CFE8FB;
    --sky-deep: #A9D7F4;
    --blush: #FBD7E4;
    --lavender: #9C98C9;
    --lavender-soft: #C7C3E6;
    --teal: #719AA0;
    --teal-ink: #29465D;
    --indigo: #1F3B66;
    --accent: #9C98C9;
    --accent-ink: #3E3D55;
    --wash: #EEF0F7;

    --display: "Archivo", "Helvetica Neue", "PingFang TC", "Noto Sans TC", Arial, sans-serif;
    --latin: "EB Garamond", "Noto Serif TC", "Songti TC", Georgia, serif;
    --serif: "Noto Serif TC", "Songti TC", "Noto Serif CJK TC", "PMingLiU", serif;
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Helvetica Neue", "Noto Sans TC", Arial, sans-serif;

    --r-xl: 30px; --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --ease-sheet: cubic-bezier(.32, .72, 0, 1);
    --spring: cubic-bezier(.34, 1.45, .55, 1);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --gutter: 20px;
    --maxw: 1080px;
    --tab-h: 62px;
    --mini-h: 58px;
    --dock-gap: 8px;
    --dock-bottom: max(10px, calc(var(--safe-b) - 6px));
    --topbar-h: 56px;
    --top-space: calc(var(--safe-t) + var(--topbar-h) + 22px);
    --dock-space: calc(var(--dock-bottom) + var(--tab-h) + 28px);
    --shadow-1: 0 1px 2px rgba(41, 52, 86, .05), 0 6px 18px rgba(41, 52, 86, .05);
    --shadow-2: 0 2px 6px rgba(41, 52, 86, .06), 0 18px 40px rgba(41, 52, 86, .09);
    color-scheme: light;
  }
  html.has-mini { --dock-space: calc(var(--dock-bottom) + var(--tab-h) + var(--mini-h) + var(--dock-gap) + 28px); }
  @media (min-width: 760px) { :root { --gutter: 36px; --topbar-h: 60px; } }
}

@layer base {
  html { background: var(--porcelain); scroll-padding-top: var(--top-space); }
  body {
    min-height: 100dvh; background: var(--porcelain); color: var(--ink);
    font: 400 16px/1.55 var(--ui); letter-spacing: 0;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden; overscroll-behavior-y: none;
  }
  html.is-locked, html.is-locked body { overflow: hidden; }
  html.is-locked body { position: fixed; left: 0; right: 0; width: 100%; }
  button, [data-press], .row { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  :focus-visible { outline: 2px solid var(--indigo); outline-offset: 3px; border-radius: 10px; }
  ::selection { background: var(--sky); }
  input[type=search], input[type=text] { font-size: 16px; } /* prevents iOS zoom on focus */
  .wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding-left: calc(var(--gutter) + var(--safe-l)); padding-right: calc(var(--gutter) + var(--safe-r)); }
  .tnum { font-variant-numeric: tabular-nums; }
}

@layer components {
  /* ---------- liquid glass (navigation and controls only) ---------- */
  .glass {
    position: relative; isolation: isolate;
    background: linear-gradient(180deg, rgba(255,255,255,.66), rgba(255,255,255,.42));
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.92), inset 0 -1px 1px rgba(255,255,255,.35), inset 0 0 0 .5px rgba(255,255,255,.55), 0 10px 30px rgba(41, 52, 86, .11), 0 1px 3px rgba(41, 52, 86, .07);
  }
  .glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1; padding: 1px; background: linear-gradient(140deg, rgba(255,255,255,.95), rgba(255,255,255,.15) 38%, rgba(255,255,255,0) 60%, rgba(255,255,255,.55)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: rgba(250,251,253,.96); } }
  html.perf-balanced .glass { -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%); }
  html.perf-lite .glass { -webkit-backdrop-filter: blur(8px) saturate(140%); backdrop-filter: blur(8px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,.88), 0 6px 18px rgba(41,52,86,.08); }
  html.perf-balanced .cardmodal__scrim { -webkit-backdrop-filter: blur(10px) saturate(140%); backdrop-filter: blur(10px) saturate(140%); }
  html.perf-lite .cardmodal__scrim { -webkit-backdrop-filter: blur(6px) saturate(125%); backdrop-filter: blur(6px) saturate(125%); }
  html.perf-lite .player__sheet { will-change: auto; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 48px; padding: 0 20px; border-radius: 999px; white-space: nowrap;
    font: 600 15px/1 var(--display); letter-spacing: .01em; color: var(--ink);
    background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2);
    transition: transform .18s var(--ease), background-color .2s, box-shadow .2s, opacity .2s;
  }
  .btn .i { width: 20px; height: 20px; flex: none; }
  .btn--primary { background: var(--indigo); color: #fff; box-shadow: 0 8px 18px rgba(31, 59, 102, .22); }
  .btn--quiet { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); }
  .btn--small { height: 38px; padding: 0 15px; font-size: 14px; }
  .btn--block { width: 100%; }
  .btn:disabled, .btn[aria-disabled=true] { opacity: .42; pointer-events: none; }
  .is-pressed { transform: scale(.965); }
  .btn.is-pressed, .icon-btn.is-pressed, .pbtn.is-pressed, .action.is-pressed, .pact.is-pressed { transform: scale(.93); }

  .icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; flex: none; border-radius: 50%; color: var(--ink); transition: transform .18s var(--ease), background-color .2s, color .2s; }
  .icon-btn .i { width: 22px; height: 22px; }
  .icon-btn--quiet { background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
  .icon-btn--sm { width: 38px; height: 38px; } .icon-btn--sm .i { width: 19px; height: 19px; }
  .icon-btn.is-on, .icon-btn[aria-pressed=true] { color: var(--accent-ink); }

  /* pill icon button used in bars (passes, library, cities) */
  .pbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; min-width: 50px; padding: 0 16px; border-radius: 999px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink); font: 700 14px/1 var(--display); letter-spacing: .06em; transition: transform .18s var(--ease), opacity .2s; }
  .pbtn .i { width: 21px; height: 21px; }
  .pbtn--primary { background: var(--indigo); color: #fff; box-shadow: 0 8px 18px rgba(31,59,102,.22); padding: 0 22px; }
  .pbtn:disabled { opacity: .4; pointer-events: none; }

  .link-btn { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; min-width: 44px; justify-content: center; padding: 0 2px; font: 600 14px/1 var(--display); color: var(--accent-ink); }
  .link-btn .i { width: 20px; height: 20px; }

  .chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); font: 600 13px/1 var(--display); color: var(--ink-2); white-space: nowrap; }
  .chip.is-active { background: var(--indigo); color: #fff; box-shadow: none; }
  .tag { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,.75); color: var(--accent-ink); font: 700 11.5px/1 var(--display); letter-spacing: .04em; white-space: nowrap; }
  .tag .i { width: 13px; height: 13px; }

  /* ---------- segmented control with glass thumb ---------- */
  .seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: 999px; background: rgba(47,54,84,.055); }
  .seg__thumb { position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 999px; background: var(--paper); box-shadow: 0 1px 2px rgba(41,52,86,.1), 0 4px 12px rgba(41,52,86,.08), inset 0 0 0 .5px rgba(41,52,86,.06); transition: transform .5s var(--spring), width .4s var(--ease); will-change: transform; }
  .seg__btn { position: relative; z-index: 1; height: 36px; padding: 0 8px; border-radius: 999px; font: 600 13px/1 var(--display); color: var(--ink-2); white-space: nowrap; transition: color .25s; }
  .seg__btn[aria-selected=true] { color: var(--ink); }
  .seg.is-dragging .seg__thumb { transition: width .3s var(--ease); transform-origin: center; }

  .switch { position: relative; width: 51px; height: 31px; flex: none; border-radius: 999px; background: rgba(120,128,150,.28); transition: background-color .25s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); transition: transform .32s var(--spring); }
  .switch[aria-checked=true] { background: var(--indigo); }
  .switch[aria-checked=true]::after { transform: translateX(20px); }

  /* ---------- section heads ---------- */
  .sec { padding-top: 46px; }
  .sec__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .sec__title { font: 700 22px/1.2 var(--serif); letter-spacing: .04em; color: var(--ink); }
  .sec__title small { display: block; margin-top: 6px; font: 500 13px/1.4 var(--ui); color: var(--ink-3); letter-spacing: 0; }
  .label { font: 700 11px/1 var(--display); letter-spacing: .16em; color: var(--teal); text-transform: uppercase; }

  /* ---------- track rows ---------- */
  .rows { display: grid; }
  .row { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 66px; padding: 8px 2px 8px 0; cursor: pointer; border-bottom: 1px solid var(--line); transition: background-color .2s; }
  .row:last-child { border-bottom: 0; }
  .row__no { font: 600 12.5px/1 var(--display); color: var(--ink-3); text-align: center; font-variant-numeric: tabular-nums; }
  .row__main { min-width: 0; }
  .row__title { display: block; font: 500 17px/1.25 var(--latin); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row__sub { display: flex; align-items: center; gap: 4px; margin-top: 3px; font: 500 12.5px/1.3 var(--ui); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row__off { display: inline-grid; flex: none; color: var(--teal); }
  .row__off .i { width: 14px; height: 14px; }
  .row__actions { display: flex; align-items: center; gap: 0; margin-right: -8px; }
  .row__actions .icon-btn { width: 40px; height: 40px; color: var(--ink-3); }
  .row__actions .icon-btn .i { width: 20px; height: 20px; }
  .row__actions .is-fav { color: #C2546E; }
  .row.is-current .row__title { color: var(--accent-ink); }
  .row.is-disliked .row__title, .row.is-disliked .row__sub { opacity: .45; text-decoration: line-through; text-decoration-color: rgba(47,54,84,.3); }
  .row.is-pressed { background: rgba(47,54,84,.035); transform: none; }
  .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
  .eq i { width: 3px; border-radius: 2px; background: var(--accent-ink); height: 40%; animation: eq 1s var(--ease) infinite alternate; }
  .eq i:nth-child(2) { animation-delay: -.4s; } .eq i:nth-child(3) { animation-delay: -.7s; }
  .is-paused .eq i { animation-play-state: paused; }
  @keyframes eq { 0% { height: 25%; } 50% { height: 100%; } 100% { height: 45%; } }

  .empty { padding: 28px 22px; border-radius: var(--r-lg); background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); text-align: center; color: var(--ink-2); }
  .empty b { display: block; margin-bottom: 6px; font: 700 17px/1.3 var(--serif); color: var(--ink); }
  .empty p { font-size: 14px; }
  .empty .btn { margin-top: 16px; }

  .toast { position: fixed; left: 50%; bottom: calc(var(--dock-space) + 6px); z-index: 99; max-width: calc(100vw - 32px); display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-radius: 999px; background: rgba(31, 40, 68, .92); color: #fff; font: 500 14px/1.3 var(--ui); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); transform: translate(-50%, 16px) scale(.96); opacity: 0; pointer-events: none; transition: transform .4s var(--spring), opacity .25s; }
  .toast.show { transform: translate(-50%, 0) scale(1); opacity: 1; pointer-events: auto; }
  .toast button { color: #A9D7F4; font-weight: 600; }

  .globe-mark { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2; }
  .globe-mark .gm-dot { fill: currentColor; stroke: none; }
  .globe-mark .gm-m { transform-origin: 20px 20px; animation: gm-spin 9s linear infinite; }
  @keyframes gm-spin { 0% { transform: scaleX(1); } 25% { transform: scaleX(.12); } 50% { transform: scaleX(1); } 75% { transform: scaleX(.12); } 100% { transform: scaleX(1); } }
  .i { width: 22px; height: 22px; }

  .perf { position: relative; display: block; height: 0; border-top: 1.5px dashed rgba(47,54,84,.16); margin: 0 14px; }
  .perf::before, .perf::after { content: ""; position: absolute; top: -10px; width: 20px; height: 20px; border-radius: 50%; background: var(--porcelain); }
  .perf::before { left: -24px; } .perf::after { right: -24px; }

  .panel { padding: 6px 16px; border-radius: var(--r-lg); background: var(--paper); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); }
  .rights { margin-top: 12px; font-size: 13px; line-height: 1.7; color: var(--ink-3); }
  .filters { display: flex; gap: 8px; margin-top: 14px; }
  .filters--wrap { flex-wrap: wrap; }
}

/* ==========================================================================
   Top bar · fixed slots so controls never move between pages
   ========================================================================== */
@layer components {
  .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; padding: calc(var(--safe-t) + 8px) calc(12px + var(--safe-r)) 0 calc(12px + var(--safe-l)); pointer-events: none; }
  .topbar__bar { pointer-events: auto; display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; max-width: 720px; height: var(--topbar-h); margin: 0 auto; padding: 0 4px; border-radius: 999px; transition: transform .35s var(--ease), opacity .3s; }
  .topbar__bar .icon-btn { margin: 0 auto; }
  .tb-title { position: relative; height: 100%; display: grid; place-items: center; overflow: hidden; }
  .tb-title > * { grid-area: 1 / 1; transition: opacity .3s var(--ease), transform .4s var(--ease); }
  .tb-word { display: inline-flex; align-items: center; gap: 9px; font: 700 15px/1 var(--display); letter-spacing: .12em; color: var(--ink); }
  .tb-page { max-width: 100%; padding: 0 6px; font: 500 19px/1.1 var(--latin); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transform: translateY(8px); }
  .topbar.show-page .tb-page { opacity: 1; transform: none; }
  .topbar.show-page .tb-word { opacity: 0; transform: translateY(-8px); }
  .tb-dot { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: #E0566F; box-shadow: 0 0 0 2px rgba(255,255,255,.9); transform: scale(0); transition: transform .4s var(--spring); }
  .has-pass #tbRight[data-mode=pass] .tb-dot { transform: scale(1); }
  #tbRight { position: relative; }
}

/* ==========================================================================
   Dock · mini player + liquid-glass tab bar (shrinks while scrolling down)
   ========================================================================== */
@layer components {
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; pointer-events: none; height: 0; }
  .dock > * { pointer-events: auto; }

  .libhead { margin-top: 18px; padding: 20px; border-radius: var(--r-xl); background: var(--paper); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); }
  .libhead__name { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .libhead__name h2 { min-width: 0; font: 400 32px/1.05 var(--latin); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .libhead__stat { margin-top: 6px; font: 500 13px/1.5 var(--ui); color: var(--ink-3); }
  .libhead__actions { display: flex; gap: 8px; margin-top: 18px; }
  .libhead__actions .pbtn { flex: 1; min-width: 0; padding: 0; }
  .libhead__actions .pbtn--primary { flex: 1.4; }
  .settings { border-radius: var(--r-lg); background: var(--paper); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); overflow: hidden; }
  .setting { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 60px; padding: 10px 16px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
  .setting:last-child { border-bottom: 0; }
  .setting b { display: block; font: 700 15px/1.3 var(--serif); }
  .setting span { display: block; margin-top: 2px; font: 500 12.5px/1.45 var(--ui); color: var(--ink-3); }
  .setting > .i { color: var(--ink-3); flex: none; }
  .setting .seg { flex: none; min-width: 200px; }
  .setting--stack { flex-direction: column; align-items: stretch; gap: 12px; padding-top: 14px; padding-bottom: 14px; }
  .setting--stack .seg { min-width: 0; }
  .setting--plain { margin-top: 14px; padding: 12px 0; border: 0; flex-wrap: wrap; }
  .setting--plain .seg { min-width: 180px; flex: 1; }
  .a2hs { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: start; padding: 16px; border-radius: var(--r-lg); background: linear-gradient(135deg, #fff, #EEF3FB); box-shadow: inset 0 0 0 1px var(--line); }
  .a2hs img { width: 44px; height: 44px; border-radius: 11px; box-shadow: 0 2px 8px rgba(41,52,86,.15); }
  .a2hs b { display: block; font: 700 15px/1.3 var(--serif); }
  .a2hs p { margin-top: 4px; font-size: 13.5px; line-height: 1.65; color: var(--ink-2); }
  .a2hs .i { display: inline; width: 16px; height: 16px; vertical-align: -3px; color: #0A7AFF; }

  /* wallet: stacked ticket stubs */
  .wallet { display: grid; }
  .wallet__card { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; height: 86px; margin-top: -24px; padding: 16px 18px 24px; align-content: start; border-radius: 20px; background: linear-gradient(160deg, #FFFFFF, #EEF3F8); box-shadow: 0 -6px 18px rgba(41,52,86,.08), inset 0 0 0 1px var(--line); text-align: left; width: 100%; }
  .wallet__card:first-child { margin-top: 0; }
  .wallet__card:last-child { height: 76px; padding-bottom: 16px; }
  .wallet__card b { font: 700 26px/1 var(--display); color: var(--accent); }
  .wallet__card span { display: grid; gap: 4px; font: 500 16px/1.15 var(--latin); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wallet__card small { font: 700 10px/1 var(--display); letter-spacing: .14em; color: var(--teal); }
  .wallet__card em { font: 700 11px/1 var(--display); font-style: normal; color: var(--ink-3); }

  /* ---------- destination page ---------- */
  .dest { padding-top: 0; }
  .dest__hero { position: relative; margin: 0 calc(-1 * var(--gutter)); padding: calc(var(--top-space) + 6px) var(--gutter) 26px; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 16%, var(--porcelain)), var(--porcelain)); overflow: hidden; }
  .dest__code { position: absolute; right: calc(var(--gutter) - 6px); top: calc(var(--top-space) + 40px); font: 700 clamp(84px, 28vw, 180px)/.8 var(--display); color: color-mix(in srgb, var(--accent) 28%, transparent); letter-spacing: -.03em; pointer-events: none; user-select: none; }
  .dest--lit .dest__code { writing-mode: vertical-rl; font: 900 clamp(56px, 17vw, 120px)/1 var(--serif); letter-spacing: .06em; top: calc(var(--top-space) - 4px); }
  .dest__meta { position: relative; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .dest__title { position: relative; margin-top: 60px; font: 400 clamp(48px, 13.5vw, 92px)/.95 var(--latin); letter-spacing: -.015em; color: var(--accent-ink); max-width: 11em; }
  .dest--lit .dest__title { font: 900 clamp(46px, 13vw, 84px)/1.05 var(--serif); letter-spacing: .06em; max-width: 6.5em; }
  .dest__cn { position: relative; margin-top: 12px; font: 500 17px/1.4 var(--latin); color: var(--accent-ink); letter-spacing: .02em; }
  .dest__line { position: relative; margin-top: 14px; max-width: 30em; font: 500 15.5px/1.85 var(--serif); color: color-mix(in srgb, var(--accent-ink) 82%, black); }
  .dest__more { position: relative; margin-top: 4px; }
  .dest__desc { position: relative; margin-top: 8px; max-width: 34em; font: 500 14.5px/1.85 var(--serif); color: var(--ink-2); }
  .actionbar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 22px; }
  .action { position: relative; display: grid; place-items: center; height: 56px; border-radius: 18px; background: var(--paper); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); color: var(--ink); }
  .action .i { width: 23px; height: 23px; }
  .action--primary { background: var(--indigo); color: #fff; box-shadow: 0 8px 20px rgba(31,59,102,.26); }
  .action.is-locked { color: var(--ink-3); }
  .action.is-ready { color: var(--accent-ink); box-shadow: var(--shadow-1), inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 60%, transparent); }
  .action__dot { position: absolute; top: 10px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: #E0566F; box-shadow: 0 0 0 2px #fff; }
  .note { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; padding: 12px 14px; border-radius: var(--r-md); background: rgba(255,255,255,.6); font-size: 13px; line-height: 1.6; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
  .note .i { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--accent-ink); }
  .drawer-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .drawer-actions .btn { min-width: 0; padding: 0 10px; }
  .tracks-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-bottom: 8px; }
  .minisearch { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 999px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
  .minisearch .i { width: 18px; height: 18px; color: var(--ink-3); }
  .minisearch input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; }
  .meters { display: grid; gap: 14px; padding: 18px; border-radius: var(--r-lg); background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
  .meter { display: grid; grid-template-columns: 96px 1fr 30px; align-items: center; gap: 12px; font: 600 12px/1 var(--display); color: var(--ink-2); }
  .meter i { position: relative; height: 4px; border-radius: 4px; background: var(--mist); overflow: hidden; }
  .meter i::after { content: ""; position: absolute; inset: 0; width: var(--v); border-radius: inherit; background: var(--accent); }
  .meter b { text-align: right; font-variant-numeric: tabular-nums; }

  footer.foot { margin-top: 56px; padding-top: 22px; border-top: 1px solid var(--line); font: 500 12.5px/1.6 var(--ui); color: var(--ink-3); display: grid; gap: 6px; }
  footer.foot b { color: var(--ink-2); font: 700 13px/1 var(--display); letter-spacing: .12em; }
}

/* ==========================================================================
   Player sheet
   ========================================================================== */
@layer overlays {
  .player { position: fixed; inset: 0; z-index: 70; visibility: hidden; pointer-events: none; }
  .player.is-open { visibility: visible; pointer-events: auto; }
  .player__sheet { position: absolute; inset: 0; background: var(--porcelain); overflow: hidden; will-change: transform, clip-path; }
  .player__wash { position: absolute; inset: 0 0 auto 0; height: 66%; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 26%, var(--porcelain)), var(--porcelain)); pointer-events: none; }
  .player__scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: calc(var(--safe-t) + 6px) calc(20px + var(--safe-r)) calc(var(--safe-b) + 28px) calc(20px + var(--safe-l)); }
  .player__inner { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; }
  .player__inner > * { flex: none; }
  .player__grab { width: 40px; height: 5px; margin: 4px auto 6px; border-radius: 5px; background: rgba(47,54,84,.2); }
  .player__head { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px; touch-action: none; }
  .player__from { text-align: center; min-width: 0; }
  .player__from small { display: block; font: 700 10.5px/1.2 var(--display); letter-spacing: .14em; color: var(--ink-3); }
  .player__from button { display: block; max-width: 100%; margin: 3px auto 0; font: 500 17px/1.2 var(--latin); color: var(--accent-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* the record (no tonearm) */
  .stage { position: relative; width: min(100%, clamp(240px, calc(100dvh - 470px), 420px)); aspect-ratio: 1; margin: 14px auto 0; }
  .vinyl { position: absolute; left: 6%; top: 6%; width: 88%; aspect-ratio: 1; border-radius: 50%; touch-action: none; cursor: grab; z-index: 1; }
  .vinyl:active { cursor: grabbing; }
  .vinyl__rotor { position: absolute; inset: 0; border-radius: 50%; will-change: transform; background:
      radial-gradient(circle at 50% 50%, transparent 0 33%, rgba(255,255,255,.045) 33.4% 34%, transparent 34.5%),
      repeating-radial-gradient(circle at 50% 50%, #1b2030 0 1.1px, #262c3e 1.1px 2.3px), #1d2232;
    box-shadow: 0 30px 60px rgba(41,52,86,.30), 0 6px 16px rgba(41,52,86,.18), inset 0 0 0 2px rgba(255,255,255,.06); }
  .vinyl[data-material=color] .vinyl__rotor { background:
      radial-gradient(circle at 50% 50%, transparent 0 33%, rgba(255,255,255,.18) 33.4% 34%, transparent 34.5%),
      repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 0 1.2px, rgba(41,52,86,.075) 1.2px 2.4px),
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), transparent 55%), var(--disc);
    box-shadow: 0 30px 60px rgba(41,52,86,.2), 0 6px 16px rgba(41,52,86,.12), inset 0 0 0 1.5px rgba(255,255,255,.35); }
  .vinyl[data-material=frost] .vinyl__rotor { background:
      repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 0 1.2px, rgba(41,52,86,.05) 1.2px 2.4px),
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(236,241,248,.95) 60%, rgba(222,232,244,.98));
    box-shadow: 0 30px 60px rgba(41,52,86,.16), inset 0 0 0 1.5px rgba(255,255,255,.8), inset 0 0 40px rgba(255,255,255,.5); }
  .vinyl__label { position: absolute; inset: 32%; border-radius: 50%; background: var(--accent); display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  .vinyl__label svg { position: absolute; inset: 6%; width: 88%; height: 88%; }
  .vinyl__label text { font: 700 6.2px var(--display); letter-spacing: .2em; fill: rgba(255,255,255,.88); }
  .vinyl__code { font: 700 clamp(9px, 2.6vw, 12px)/1 var(--display); letter-spacing: .06em; color: #fff; transform: translateY(-78%); }
  .vinyl__hole { position: absolute; left: 50%; top: 50%; width: 3.2%; aspect-ratio: 1; border-radius: 50%; background: var(--porcelain); transform: translate(-50%, -50%); box-shadow: inset 0 1px 2px rgba(0,0,0,.4); }
  .vinyl__sheen { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; background: conic-gradient(from 210deg, transparent 0 8%, rgba(255,255,255,.16) 13%, transparent 20% 52%, rgba(255,255,255,.1) 58%, transparent 65%); mix-blend-mode: screen; }
  .scrub-readout { position: absolute; left: 50%; top: 50%; z-index: 2; transform: translate(-50%, -50%) scale(.9); padding: 9px 14px; border-radius: 999px; background: rgba(31,40,68,.84); color: #fff; font: 700 14px/1 var(--display); font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .2s, transform .3s var(--spring); pointer-events: none; white-space: nowrap; }
  .player.is-scrubbing .scrub-readout { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* Taipei Limited: wordmark behind, 台北 beneath, the record in front */
  .limited { position: absolute; inset: 0; pointer-events: none; display: none; }
  .stage.is-limited .limited { display: block; }
  .stage.is-limited { width: min(100%, clamp(250px, calc(100dvh - 430px), 440px)); aspect-ratio: .86; }
  .stage.is-limited .vinyl { left: 13%; top: 19%; width: 74%; }
  .limited__word { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: auto; }
  .limited__cn { position: absolute; left: 50%; bottom: 0; width: 26%; height: auto; transform: translateX(-50%); }
  .limited__tag { position: absolute; right: 2%; bottom: 3%; padding: 5px 9px; border-radius: 999px; font: 700 9.5px/1 var(--display); letter-spacing: .16em; color: var(--ink-2); background: rgba(255,255,255,.7); box-shadow: inset 0 0 0 1px var(--line); }
  .stage.is-limited ~ .np { margin-top: 10px; }

  .np { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; margin-top: 10px; }
  .np__title { font: 500 28px/1.12 var(--latin); letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .np__title.is-long { font-size: 22px; line-height: 1.18; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .np__artist { margin-top: 4px; font: 500 14px/1.35 var(--ui); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np__actions { display: flex; }
  .np__actions .is-fav { color: #C2546E; }

  .seek { margin-top: 18px; touch-action: none; }
  .seek__track { position: relative; height: 22px; display: grid; align-items: center; cursor: pointer; }
  .seek__rail { position: relative; height: 5px; border-radius: 5px; background: rgba(47,54,84,.1); overflow: hidden; transition: height .2s var(--ease); }
  .seek__buf { position: absolute; inset: 0; transform-origin: 0 50%; background: rgba(47,54,84,.08); }
  .seek__fill { position: absolute; inset: 0; transform-origin: 0 50%; background: var(--accent-ink); transform: scaleX(0); }
  .seek.is-active .seek__rail { height: 9px; }
  .seek__times { display: flex; justify-content: space-between; margin-top: 4px; font: 600 11.5px/1 var(--display); color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .transport { display: grid; grid-template-columns: 1fr 1fr auto 1fr 1fr; align-items: center; justify-items: center; margin-top: 12px; }
  .transport .icon-btn { width: 52px; height: 52px; }
  .transport .icon-btn .i { width: 30px; height: 30px; }
  .transport .t-small .i { width: 22px; height: 22px; }
  .transport .t-small { color: var(--ink-3); position: relative; }
  .transport .t-small.is-on { color: var(--accent-ink); }
  .transport .t-small.is-on::after { content: ""; position: absolute; bottom: 6px; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
  .playbtn { width: 76px !important; height: 76px !important; border-radius: 50%; background: var(--ink); color: #fff !important; box-shadow: 0 12px 28px rgba(41,52,86,.28); }
  .playbtn .i { width: 32px !important; height: 32px !important; }

  /* vintage: a quiet row under the transport */
  .vintage { margin-top: 20px; padding: 12px 0 0; border-top: 1px solid var(--line); }
  .vintage__head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 2px 10px; }
  .vintage__head b { display: inline-flex; align-items: center; gap: 7px; flex: none; white-space: nowrap; font: 700 12px/1 var(--display); letter-spacing: .1em; color: var(--ink-2); }
  .vintage__head b .i { width: 16px; height: 16px; color: var(--accent-ink); }
  .vintage__state { min-width: 0; font: 500 12px/1.3 var(--ui); color: var(--ink-3); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vintage .seg { background: rgba(47,54,84,.05); }
  .vintage .seg__btn { height: 34px; font: 700 12.5px/1 var(--display); letter-spacing: .02em; }

  /* actions: output · add to playlist · share · download · up next */
  .pactions { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 16px; padding: 6px; border-radius: 999px; background: rgba(255,255,255,.7); box-shadow: inset 0 0 0 1px var(--line); }
  .pact { position: relative; display: grid; place-items: center; height: 48px; border-radius: 999px; color: var(--ink-2); transition: transform .18s var(--ease), background-color .2s, color .2s; }
  .pact .i { width: 23px; height: 23px; }
  .pact[aria-pressed=true], .pact.is-on { color: var(--accent-ink); background: #fff; box-shadow: 0 1px 4px rgba(41,52,86,.1); }
  .pact.is-busy::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: conic-gradient(var(--accent-ink) calc(var(--p) * 360deg), transparent 0); -webkit-mask: radial-gradient(circle, transparent 62%, #000 64%); mask: radial-gradient(circle, transparent 62%, #000 64%); opacity: .7; }

  .story { margin-top: 24px; padding: 20px; border-radius: var(--r-lg); background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
  .story h3 { font: 700 18px/1.35 var(--serif); }
  .story p { margin-top: 10px; font: 500 14.5px/1.85 var(--serif); color: var(--ink-2); }
  .story__tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .story__tags .tag { background: var(--mist); }
  .story .story__src { margin-top: 14px; font: 500 12.5px/1.6 var(--ui); color: var(--ink-3); }
  .story a { color: var(--accent-ink); }

  /* queue mode: the record steps aside, Up Next takes its place, controls stay put */
  .player__grab { order: 0; } .player__head { order: 1; } .stage { order: 2; } .np { order: 3; } .queue { order: 4; } .seek { order: 5; } .transport { order: 6; } .vintage { order: 7; } .pactions { order: 8; } .story { order: 9; }
  .np__disc { display: none; }
  .queue { display: none; }
  .player.q-open .stage { display: none; }
  .player.q-open .np { grid-template-columns: 56px minmax(0, 1fr) auto; margin-top: 16px; }
  .player.q-open .np__disc { display: block; position: relative; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); box-shadow: 0 4px 12px rgba(41,52,86,.2); }
  .player.q-open .np__disc::after { content: ""; position: absolute; inset: 40%; border-radius: 50%; background: var(--porcelain); }
  .player.q-open .np__title { font-size: 22px; }
  .player.q-open .queue { display: block; margin-top: 10px; max-height: min(44dvh, 460px); overflow-y: auto; overscroll-behavior: contain; padding: 0 12px 12px; border-radius: var(--r-lg); background: rgba(255,255,255,.75); box-shadow: inset 0 0 0 1px var(--line); animation: view-in .35s var(--ease-out) backwards; }
  .player.q-open .queue__head:first-child { margin-top: 12px; }
  .queue__head { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 6px; }
  .queue__head b { font: 700 16px/1.2 var(--serif); }
  .queue__head span { font: 500 12px/1 var(--ui); color: var(--ink-3); }
  .queue .row { min-height: 58px; grid-template-columns: 28px minmax(0, 1fr) auto; }
  .queue .row--radio .row__no { color: var(--accent-ink); }
  .queue__auto { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: var(--r-md); background: rgba(255,255,255,.7); box-shadow: inset 0 0 0 1px var(--line); }
  .queue__auto b { font: 700 14px/1.2 var(--serif); }
  .queue__auto span { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }

  /* ---------- bottom sheets ---------- */
  .sheet-root { position: fixed; inset: 0; z-index: 80; pointer-events: none; }
  .sheet-scrim { position: absolute; inset: 0; background: rgba(31,40,68,.26); opacity: 0; transition: opacity .3s; pointer-events: auto; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; max-height: calc(100dvh - var(--safe-t) - 40px); display: flex; flex-direction: column; border-radius: 28px 28px 0 0; background: var(--porcelain); box-shadow: 0 -10px 40px rgba(41,52,86,.18); transform: translateY(105%); transition: transform .5s var(--ease-sheet); pointer-events: auto; overflow: hidden; }
  .sheet-root.is-open .sheet-scrim { opacity: 1; }
  .sheet-root.is-open .sheet { transform: none; }
  .sheet__grab { flex: none; padding: 8px 0 4px; touch-action: none; }
  .sheet__grab i { display: block; width: 38px; height: 5px; margin: 0 auto; border-radius: 5px; background: rgba(47,54,84,.2); }
  .sheet__head { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: start; gap: 10px; padding: 6px 20px 10px; touch-action: none; }
  .sheet__head h2 { font: 700 21px/1.25 var(--serif); }
  .sheet__head p { margin-top: 5px; font: 500 13px/1.5 var(--ui); color: var(--ink-3); }
  .sheet__body { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 4px 20px calc(var(--safe-b) + 22px); }
  .sheet-note { font: 500 14.5px/1.85 var(--serif); color: var(--ink-2); margin: 14px 0 4px; }
  .menu { border-radius: var(--r-lg); background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
  .menu button, .menu a { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 54px; padding: 0 16px; border-bottom: 1px solid var(--line); font: 500 15px/1.25 var(--ui); text-align: left; text-decoration: none; }
  .menu button:last-child, .menu a:last-child { border-bottom: 0; }

  /* ---------- welcome ---------- */
  .welcome { position: fixed; inset: 0; z-index: 95; background: var(--porcelain); overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; transition: opacity .5s var(--ease), transform .6s var(--ease-out); }

  /* bluetooth ritual */

  .ritual h3 { margin-top: 12px; font: 400 27px/1.1 var(--latin); }

}

@layer utilities {

  .skip-link { position: fixed; left: 12px; top: -60px; z-index: 100; padding: 10px 14px; border-radius: 10px; background: var(--ink); color: #fff; }

  }

}

async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); return true; } catch (_) {}
  const ta = document.createElement('textarea');
  ta.value = txt; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
  ta.remove(); return ok;
}

  if (data.url) { await copyText(data.url); toast('已複製連結'); return 'copied'; }

}

  const bytes = new TextEncoder().encode(JSON.stringify(obj)); let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlDecode(str) {

(function hydrateEmptyThemes() {
  for (const d of DATA) {

    const seen = new Set(), pool = [];
    for (const src of DATA) {

      for (const t of src.tracks) {

        seen.add(t.audioSrc);
        const hay = `${t.title || ''} ${t.artist || ''} ${t.vibe || ''} ${src.t || ''}`.toLowerCase();
        let score = 0; for (const w of words) if (hay.includes(w)) score += 3;
        if (/cc0|public domain/i.test(String(t.license || ''))) score += 2;
        let tie = 0; for (const ch of String(t.audioSrc)) tie = (tie * 33 + ch.charCodeAt(0)) >>> 0;
        if (d.t !== 'MENACING DUBAI') tie = hash32(d.t + t.audioSrc);

    for (const x of pool) { const k = x.t.masterId || x.t.audioSrc; if (used.has(k)) continue; used.add(k); picked.push(x); if (picked.length >= 50) break; }
    d.tracks = picked.map((x, i) => ({ ...x.t, trackNo: i + 1, curatedTheme: d.t, curatedFrom: x.t.audioSrc, vibe: `${(d.key || '').split('·')[0].trim() || meta.name} · ${x.t.vibe || x.from}`, shareId: `${meta.slug}-${String(i + 1).padStart(3, '0')}` }));

/* ---------- libraries & favourites ---------- */
const Library = (() => {
  const clean = v => String(v || '').replace(/\s+/g, ' ').trim().slice(0, 40);
  const mkId = () => `lib-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
  function load() {
    const rows = store.get(K.libs, null);
    if (Array.isArray(rows) && rows.length) {
      return rows.map((l, i) => ({ id: String(l.id || mkId()), name: clean(l.name) || `Library ${i + 1}`, keys: Array.isArray(l.keys) ? [...new Set(l.keys.map(String))] : [], cats: Array.isArray(l.cats) ? l.cats.map(String).slice(0, 12) : [], createdAt: +l.createdAt || Date.now(), updatedAt: +l.updatedAt || Date.now() }));
    }
    const legacy = store.get(K.favLegacy, []);
    const first = { id: DEFAULT_LIB, name: 'MY LIBRARY', keys: Array.isArray(legacy) ? [...new Set(legacy.map(String))] : [], createdAt: Date.now(), updatedAt: Date.now() };
    store.set(K.libs, [first]); store.setRaw(K.activeLib, first.id);
    return [first];
  }
  let libs = load();
  const save = () => { store.set(K.libs, libs); bus.emit('library'); };
  const activeId = () => { let id = store.raw(K.activeLib) || ''; if (!libs.some(l => l.id === id)) { id = libs[0].id; store.setRaw(K.activeLib, id); } return id; };
  const active = () => libs.find(l => l.id === activeId()) || libs[0];
  const keysSet = (lib = active()) => new Set(lib?.keys || []);
  function resolve(lib = active()) {
    const keys = new Set(lib?.keys || []), out = [], seen = new Set();
    for (const th of THEMES) for (const t of th.tracks) {
      const k = trackKey(t); if (!keys.has(k) || seen.has(k)) continue; seen.add(k); out.push(t);
    }
    // keep the order in which they were saved (newest first)
    const order = new Map((lib?.keys || []).map((k, i) => [k, i]));
    return out.sort((a, b) => (order.get(trackKey(b)) ?? 0) - (order.get(trackKey(a)) ?? 0));
  }
  function isFav(t) { if (!t || t.localPersonal) return false; return keysSet().has(trackKey(t)); }
  function toggle(t, libId = activeId()) {
    if (!t || t.localPersonal) return false;
    const lib = libs.find(l => l.id === libId); if (!lib) return false;
    const k = trackKey(t); const i = lib.keys.indexOf(k); const add = i < 0;
    if (add) lib.keys.push(k); else lib.keys.splice(i, 1);

  function uniqueName(base) {
    const c = clean(base) || 'NEW LIBRARY'; const names = new Set(libs.map(l => l.name.toLowerCase()));
    if (!names.has(c.toLowerCase())) return c;
    for (let i = 2; i < 100; i++) if (!names.has(`${c} ${i}`.toLowerCase())) return `${c} ${i}`;

  }

    const lib = { id: mkId(), name: uniqueName(name), keys: [...new Set(keys.map(String))], cats: cats.slice(0, 12), createdAt: Date.now(), updatedAt: Date.now() };
    libs.push(lib); if (activate) store.setRaw(K.activeLib, lib.id); save(); return lib;

  function remove(id) { if (libs.length <= 1) return false; libs = libs.filter(l => l.id !== id); if (activeId() === id) store.setRaw(K.activeLib, libs[0].id); save(); return true; }
  function clear(id) { const l = libs.find(x => x.id === id); if (!l) return; l.keys = []; if (l.id === DEFAULT_LIB) store.set(K.favLegacy, []); save(); }
  function setActive(id) { if (!libs.some(l => l.id === id)) return; store.setRaw(K.activeLib, id); bus.emit('library'); }
  function addMany(keys, libId = activeId()) { const l = libs.find(x => x.id === libId); if (!l) return; keys.forEach(k => { if (!l.keys.includes(k)) l.keys.push(k); }); save(); }
  return { all: () => libs, active, activeId, resolve, isFav, toggle, create, rename, remove, clear, setActive, addMany, clean };

/* ==========================================================================

const MonthlyTracker = (() => {
  const LEDGER = 'musicetown.monthly.ledger.v1';
  const ARCHIVE = 'musicetown.monthly.archive.v1';
  let ledger = store.get(LEDGER, {}) || {};
  let archive = store.get(ARCHIVE, []) || [];
  let saveT = 0, lastKey = '', lastCur = 0;
  const keyOf = d => String(d.getFullYear()) + '-' + pad2(d.getMonth() + 1);
  const monthLabel = key => { const p = key.split('-'); return p[0] + ' 年 ' + Number(p[1]) + ' 月'; };
  const save = () => {
    clearTimeout(saveT);
    saveT = setTimeout(() => { store.set(LEDGER, ledger); store.set(ARCHIVE, archive); }, 500);
  };
  function row(key) {
    return ledger[key] || (ledger[key] = { seconds: 0, trackSeconds: {}, themeSeconds: {}, artistSeconds: {}, touched: Date.now() });
  }
  function add(sec, t) {
    if (!t || !Number.isFinite(sec) || sec <= 0 || sec > 15) return;
    const r = row(keyOf(new Date())), k = trackKey(t);
    r.seconds += sec;
    r.trackSeconds[k] = (r.trackSeconds[k] || 0) + sec;
    const th = themeOf(t);
    if (th) r.themeSeconds[th.t] = (r.themeSeconds[th.t] || 0) + sec;
    const a = String(t.artist || (t.localPersonal ? '本機音樂' : 'Unknown')).trim();
    r.artistSeconds[a] = (r.artistSeconds[a] || 0) + sec;
    r.touched = Date.now();
    save();
  }
  function reset(t = null) { lastKey = t ? trackKey(t) : ''; lastCur = Player?.time?.cur || 0; }
  bus.on('track', t => reset(t));
  bus.on('state', () => { lastCur = Player?.time?.cur || 0; });
  bus.on('time', () => {
    const t = Player?.current, cur = Player?.time?.cur || 0;
    if (!t || !Player.playing) { reset(t); return; }
    const k = trackKey(t);
    if (k !== lastKey) { lastKey = k; lastCur = cur; return; }
    const d = cur - lastCur; lastCur = cur;
    if (d > 0 && d <= 15) add(d, t);
  });
  window.addEventListener('pagehide', () => { store.set(LEDGER, ledger); store.set(ARCHIVE, archive); });

  const TASTE = {
    'TAIPEI DREAM':'雨夜都會','OLD TOKYO':'懷舊都會','FANTASY TAINAN':'老城浪漫','ROUGE TIBET':'高原儀式',
    'MALDIVES PARADISE':'熱帶慵懶','BUSTLING HONG KONG':'霓虹城市','SEOUL GLOW':'都會流行','MACAU CASINO':'華麗夜色',
    'JAZZ':'爵士','CROONER':'經典人聲','ROCK':'搖滾','LO-FI':'低傳真','EMO':'情緒搖滾','SPORT':'高能量',
    'RUNNING':'節奏感','POEM':'詩意民謠','SUN MOON LAKE':'靜謐自然','ALISHAN CHIAYI':'山林晨霧','GIZA ECHOES':'古文明',
    'YELLOWSTONE WONDER':'原野自然','LI SAO':'楚辭求索'
  };
  function makeSummary(key, { demo = false } = {}) {
    const src = ledger[key] || {};
    const sec = demo && !(src.seconds > 0) ? 119520 : Number(src.seconds || 0);
    const themeSeconds = demo && !Object.keys(src.themeSeconds || {}).length
      ? { 'TAIPEI DREAM': 30200, 'OLD TOKYO': 25100, 'JAZZ': 22800, 'DREAM OF THE RED CHAMBER': 17000, 'FANTASY TAINAN': 13200 }
      : (src.themeSeconds || {});
    const trackSeconds = demo && !Object.keys(src.trackSeconds || {}).length
      ? Object.fromEntries(Array.from({length: 96}, (_,i) => ['demo-' + i, 60 + i]))
      : (src.trackSeconds || {});
    const ranked = Object.entries(themeSeconds).sort((a,b) => b[1] - a[1]).slice(0, 4);
    const topThemes = ranked.map(([t, seconds]) => {
      const th = THEME_BY_T.get(t); return { t, seconds, name: th ? themeTitle(th) : t, cn: th?.cn || '', kind: th?.kind || '' };
    });
    const tastes = [];
    for (const x of topThemes) {
      const th = THEME_BY_T.get(x.t);
      const w = TASTE[x.t] || (th?.kind === 'literature' ? '文學敘事' : th?.kind === 'city' ? '城市旅行' : th?.cn || '探索');
      if (w && !tastes.includes(w)) tastes.push(w);
    }

    if (tastes.length < 3) tastes.push('夜間聆聽');
    while (tastes.length < 3) tastes.push(['細膩','懷舊','流動'][tastes.length % 3]);
    const first = topThemes[0]?.name || 'musicetown';
    const second = topThemes[1]?.name;
    const desc = sec < 60
      ? '這個月還沒有累積足夠的聆聽資料。'
      : '這個月你在' + first + (second ? '與' + second : '') + '之間停留得最久，整體偏向' + tastes.slice(0,3).join('、') + '。';
    const p = key.split('-');
    return {
      id: 'monthly-' + key, month: key, monthLabel: monthLabel(key),
      issueDate: p[0] + '.' + p[1] + '.10',
      seconds: sec, hours: Math.round(sec / 360) / 10,
      tracks: Object.values(trackSeconds).filter(v => v >= 10).length,
      topThemes, tastes: tastes.slice(0,4), desc,
      code: 'MTW-' + p[0] + p[1] + '-010'

  }
  function previousKey(d = new Date()) { return keyOf(new Date(d.getFullYear(), d.getMonth() - 1, 1)); }
  function issueDue(now = new Date()) {
    if (now.getDate() < 10) return null;

  const get = id => archive.find(x => x.id === id || x.month === id) || null;

    const d = new Date(), key = keyOf(new Date(d.getFullYear(), d.getMonth() - 1, 1));

  };
  return { issueDue, all, get, preview, makeSummary };
})();

})();

/* ==========================================================================
   Artwork · covers drawn on the device
   - lock screen / Dynamic Island (Media Session) get a cover per song:
     every theme has its own layout, and neighbouring songs alternate
     light ↔ dark grounds so the change is visible even in the tiny pill
   - Taipei Limited: while the listener is in Taipei, covers and the player
     wear the TAIPEI / 台北 wordmark with the record in front of it
   ========================================================================== */
/* coloured vinyl, chosen per recording (palette kept from R8.6) */
const VINYLS = [
  { name: 'Smoked Black', hex: '#1d2232', material: 'black' }, { name: 'Apple Green', hex: '#b9dc7c', material: 'color' }, { name: 'Light Blue', hex: '#aed6f1', material: 'color' },
  { name: 'Light Pink', hex: '#f1c3d2', material: 'color' }, { name: 'Tiffany', hex: '#93d8d0', material: 'color' }, { name: 'Frosted Glass', hex: '#e2eaf4', material: 'frost' },
  { name: 'Champagne Purple', hex: '#c6b2d8', material: 'color' }, { name: 'Oxblood', hex: '#7a2a3c', material: 'color' }, { name: 'Light Yellow', hex: '#efe3a8', material: 'color' }
];
const vinylColor = t => VINYLS[hash32(`${t?.artist || ''}|${t?.title || ''}`) % VINYLS.length];

/* region-limited editions (only Taipei for now) */
const Limited = (() => {
  const ED = {
    'TAIPEI DREAM': { code: 'TPE', word: 'assets/limited/taipei-word.png', cn: 'assets/limited/taipei-cn.png', label: '', en: 'TAIPEI LIMITED' }
  };
  const q = new URLSearchParams(location.search).get('limited');
  if (q) sess.set('mt.limitedPreview', q.toLowerCase());
  const preview = sess.get('mt.limitedPreview', null);
  const imgs = {};
  const load = src => imgs[src] || (imgs[src] = new Promise(res => { const i = new Image(); i.decoding = 'async'; i.onload = () => res(i); i.onerror = () => res(null); i.src = src; }));
  function active(themeKey = null) {
    if (themeKey && themeKey !== 'TAIPEI DREAM') return null;
    if (preview === 'taipei' || preview === 'tpe') return ED['TAIPEI DREAM'];
    try { return Geo.theme === 'TAIPEI DREAM' ? ED['TAIPEI DREAM'] : null; } catch (_) { return null; }

/* ---------- router (real history: iOS swipe-back works) ---------- */
const TABS = ['home', 'cities', 'search', 'library'];
const Router = (() => {
  let view = null, params = {}, lastTab = 'home', animatePop = false;
  const renderers = {};
  try { history.scrollRestoration = 'manual'; } catch (_) {}
  function urlFor(v, p) {
    const u = new URL(location.href); u.search = ''; u.hash = '';
    if (v === 'theme' && p.slug) u.searchParams.set('theme', p.slug);

  }
  function motionFor(prev, next, explicit = null) {
    if (explicit) return explicit;
    if (!prev || prev === next) return 'fade';
    const a = TABS.indexOf(prev), b = TABS.indexOf(next);
    if (a >= 0 && b >= 0) return b > a ? 'next' : 'prev';
    if (next === 'theme' || next === 'reader') return 'forward';
    if (prev === 'theme' || prev === 'reader') return 'back';
    return 'fade';
  }
  function show(v, p = {}, { enter = true, direction = null } = {}) {
    if (!renderers[v]) v = 'home';
    const prev = view, dir = motionFor(prev, v, direction);
    view = v; params = p;
    if (TABS.includes(v)) lastTab = v;
    const el = byId('view-' + v);
    const render = () => {
      $$('.view').forEach(s => { s.hidden = s.dataset.view !== v; });
      renderers[v](el, p, prev);
      Shell.onView(v, p);
      bus.emit('view', { v, p });
    };

       Native View Transition snapshots can reposition complex fixed/sticky UI on iOS. */
    render();
    if (enter && dir !== 'none' && !REDUCE) {
      const cls = dir === 'next' ? 'is-enter-next' : dir === 'prev' ? 'is-enter-prev' : dir === 'back' ? 'is-enter-back' : dir === 'fade' ? 'is-enter-fade' : 'is-enter-forward';
      el.classList.remove('is-entering','is-enter-next','is-enter-prev','is-enter-forward','is-enter-back','is-enter-fade');
      void el.offsetWidth;
      el.classList.add('is-entering', cls);
      el.addEventListener('animationend', function done(ev) {
        if (ev.target === el) {
          el.classList.remove('is-entering','is-enter-next','is-enter-prev','is-enter-forward','is-enter-back','is-enter-fade');
          el.removeEventListener('animationend', done);

  }

    try { history.replaceState(Object.assign({}, history.state, { v: view, p: params, y: window.scrollY }), ''); } catch (_) {}
    show(v, p);
    const st = { v, p, y: 0 };
    try { replace ? history.replaceState(st, '', urlFor(v, p)) : history.pushState(st, '', urlFor(v, p)); } catch (_) {}
    window.scrollTo(0, 0);
  }
  window.addEventListener('popstate', e => {
    if (PlayerUI.consumeHistoryClose()) return;
    const s = e.state;
    if (PlayerUI.isOpen) { PlayerUI.hide(true); if (s && s.v === view && JSON.stringify(s.p || {}) === JSON.stringify(params || {})) return; }
    if (!s || !s.v) { show('home', {}); window.scrollTo(0, 0); return; }
    show(s.v, s.p || {}, { enter: animatePop, direction: animatePop ? 'back' : 'none' });
    animatePop = false;
    requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, s.y || 0)));
  });

    register(v, fn) { renderers[v] = fn; },
    go, show,
    back() { if (history.length > 1 && history.state && history.state.v) { animatePop = true; history.back(); } else go(lastTab); },
    start() {
      const q = new URLSearchParams(location.search);
      const th = themeBySlug(q.get('theme')) || THEME_BY_SLUG.get(norm(q.get('theme')).replace(/\s+/g, '-'));
      let v = 'home', p = {};
      if (th) { v = 'theme'; p = { slug: th.slug }; }
      else if (TABS.includes(q.get('tab'))) v = q.get('tab');
      show(v, p, { enter: false });
      try { history.replaceState({ v, p, y: 0 }, '', urlFor(v, p) + location.hash); } catch (_) {}
    },
    get view() { return view; }, get params() { return params; }, get lastTab() { return lastTab; }
  };
})();

/* ---------- local files (same IndexedDB as R8.x) ---------- */
const LocalFiles = (() => {
  const DB = 'musicetownLocalLibrary', STORE = 'tracks'; let urls = new Map(); let rows = [];
  const open = () => new Promise((res, rej) => { const r = indexedDB.open(DB, 1); r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' }).createIndex('addedAt', 'addedAt'); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction(STORE, mode); const out = fn(t.objectStore(STORE)); t.oncomplete = () => { db.close(); res(out && 'result' in out ? out.result : out); }; t.onerror = () => { db.close(); rej(t.error); }; }); };
  async function refresh() {
    try { rows = await tx('readonly', s => s.getAll()) || []; } catch (_) { rows = []; }
    urls.forEach(u => URL.revokeObjectURL(u)); urls = new Map();
    bus.emit('localfiles');
  }
  function tracks(libId = Library.activeId()) {
    return rows.filter(r => String(r.libraryId || DEFAULT_LIB) === libId).sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0)).map(r => {
      if (!urls.has(r.id)) urls.set(r.id, URL.createObjectURL(r.blob));
      return { id: r.id, title: r.title, artist: r.artist, vibe: '本機音樂', license: 'PERSONAL', audioSrc: urls.get(r.id), localPersonal: true, fileName: r.name, fileSize: r.size };
    });
  }
  const parse = n => { const stem = String(n || '').replace(/\.[^.]+$/, '').trim(); const p = stem.split(/\s+-\s+/); return p.length >= 2 ? { artist: p.shift().trim(), title: p.join(' - ').trim() } : { artist: '本機音樂', title: stem || 'Untitled' }; };
  async function importFiles(list) {
    const files = [...list].filter(f => /^audio\//.test(f.type) || /\.(mp3|m4a|wav|flac|aac|ogg|oga|opus)$/i.test(f.name)); if (!files.length) return 0;
    let n = 0;
    for (const f of files) { const p = parse(f.name); try { await tx('readwrite', s => s.put({ id: `${f.name}::${f.size}::${f.lastModified}`, name: f.name, title: p.title, artist: p.artist, type: f.type || 'audio/mpeg', size: f.size, lastModified: f.lastModified, addedAt: Date.now(), libraryId: Library.activeId(), blob: f })); n++; } catch (_) { toast('裝置儲存空間不足，部分檔案未加入'); break; } }
    await refresh(); return n;
  }
  async function remove(id) { try { await tx('readwrite', s => s.delete(id)); } catch (_) {} await refresh(); }
  async function removeLibrary(libId) { for (const r of rows.filter(r => String(r.libraryId || DEFAULT_LIB) === libId)) { try { await tx('readwrite', s => s.delete(r.id)); } catch (_) {} } await refresh(); }
  if ('indexedDB' in window) refresh();
  return { tracks, importFiles, remove, removeLibrary, refresh };
})();

const CardModal = (() => {
  const m = byId('cardModal'), card = byId('cardModalCard'); let cur = null, anim = null;
  function open(i, th) {
    if (!th) return; cur = { i, th };
    setAccent(card, th);
    card.innerHTML = `<span class="cardmodal__num">${pad2(i + 1)}</span><span class="cardmodal__label">${esc(th.cn)}</span><div></div><div><div class="cardmodal__name">${esc(th.name)}<small>${esc(th.line || '')}</small></div><button class="btn btn--block cardmodal__cta" type="button" data-go>前往 ${esc(th.name)}</button></div>`;
    $('[data-go]', card).onclick = () => { const s = th.slug; close(true); Router.go('theme', { slug: s }); };
    Drawer.hold(i); m.classList.add('is-open'); m.setAttribute('aria-hidden', 'false'); scrollLock.lock();
    const r = Drawer.cardRect(i, false); const b = card.getBoundingClientRect();
    if (r && card.animate && !REDUCE) {
      const s = Math.max(r.w, r.h) / b.width, dx = r.x + r.w / 2 - (b.left + b.width / 2), dy = r.y + r.h / 2 - (b.top + b.height / 2);
      anim?.cancel(); anim = card.animate([{ transform: `translate(${dx}px,${dy}px) scale(${s})`, opacity: .4 }, { transform: 'none', opacity: 1 }], { duration: 520, easing: 'cubic-bezier(.2,.75,.25,1)' });
    }

  }

    const finish = () => { m.classList.remove('is-open'); m.setAttribute('aria-hidden', 'true'); Drawer.release(i); };
    if (instant || REDUCE || !card.animate) { finish(); return; }
    const r = Drawer.cardRect(i, true), b = card.getBoundingClientRect();
    if (!r) { finish(); return; }
    const s = Math.max(r.w, r.h) / b.width, dx = r.x + r.w / 2 - (b.left + b.width / 2), dy = r.y + r.h / 2 - (b.top + b.height / 2);
    m.classList.remove('is-open'); m.style.visibility = 'visible';
    anim?.cancel(); anim = card.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${dx}px,${dy}px) scale(${s})`, opacity: 0 }], { duration: 360, easing: 'cubic-bezier(.5,0,.3,1)' });

function libraryMenu(lib) {
  const many = Library.all().length > 1;
  Sheet.open({
    title: lib.name, sub: `${lib.keys.length} 首`,
    html: `<div class="menu"><button type="button" data-a="rename">${icon('edit')}重新命名</button><button type="button" data-a="pass">${icon('ticket')}分享 Library Pass</button><button type="button" data-a="new">${icon('plus')}新增另一個播放清單</button><button type="button" data-a="clear">${icon('minus')}清空這個清單</button>${many ? `<button type="button" class="is-danger" data-a="delete">${icon('trash')}刪除「${esc(lib.name)}」</button>` : ''}</div>`,
    mount(body, s) {
      body.addEventListener('click', async e => {
        const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
        if (a === 'rename') nameSheet(lib.name, v => Library.rename(lib.id, v), { title: '重新命名', cta: '儲存' });
        if (a === 'pass') { s.close(); Share.libraryPass(lib); }
        if (a === 'new') libraryCreator();
        if (a === 'clear') { s.close(); if (confirm(`清空「${lib.name}」裡的歌與本機音樂？`)) { Library.clear(lib.id); await LocalFiles.removeLibrary(lib.id); toast('已清空'); } }
        if (a === 'delete') { s.close(); if (confirm(`刪除「${lib.name}」？這會一併刪除其中的本機音樂。`)) { await LocalFiles.removeLibrary(lib.id); Library.remove(lib.id); toast('已刪除'); } }
      });
    }
  });
}

    const an = sheet.animate([{ clipPath: 'inset(0px 0px 0px 0px round 0px)', webkitClipPath: 'inset(0px 0px 0px 0px round 0px)' }, { clipPath: clip1, webkitClipPath: clip1 }], { duration: 440, easing: EASE });

      const d = Mini.discEl.getBoundingClientRect(), v = vinyl.getBoundingClientRect();
      if (v.width) vinyl.animate([{ transform: 'none' }, { transform: `translate(${d.left + d.width / 2 - (v.left + v.width / 2)}px, ${d.top + d.height / 2 - (v.top + v.height / 2)}px) scale(${d.width / v.width})` }], { duration: 440, easing: EASE, fill: 'forwards' }).onfinish = function () { this.cancel(); };
    }

    an.onfinish = finishHide;
  }

  /* drag down to dismiss (header, grabber, or the top of the scroll area) */
  let dd = null;
  const dragStart = y => { dd = { y, t: performance.now(), dy: 0 }; sheet.style.transition = 'none'; };
  const dragMove = y => { if (!dd) return false; const dy = Math.max(0, y - dd.y); dd.dy = dy; sheet.style.transform = `translateY(${dy}px)`; sheet.style.borderRadius = `${Math.min(34, dy / 4)}px`; return dy > 4; };
  const dragEnd = () => {
    if (!dd) return; const v = dd.dy / Math.max(1, performance.now() - dd.t); const dy = dd.dy; dd = null;
    if (dy > 140 || (v > .6 && dy > 40)) hide(false, { slide: true });
    else { sheet.style.transition = 'transform .45s cubic-bezier(.34,1.3,.55,1), border-radius .45s'; sheet.style.transform = ''; sheet.style.borderRadius = ''; setTimeout(() => sheet.style.transition = '', 460); }
  };
  const head = byId('plHead');
  head.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; dragStart(e.clientY); try { head.setPointerCapture(e.pointerId); } catch (_) {} });
  head.addEventListener('pointermove', e => dragMove(e.clientY));
  head.addEventListener('pointerup', dragEnd); head.addEventListener('pointercancel', dragEnd);
  let ts = null;
  scroller.addEventListener('touchstart', e => { if (scroller.scrollTop <= 0 && !e.target.closest('.vinyl,.seek,.seg')) ts = { y: e.touches[0].clientY, armed: false }; else ts = null; }, { passive: true });
  scroller.addEventListener('touchmove', e => {
    if (!ts) return; const y = e.touches[0].clientY;
    if (!ts.armed) { if (y - ts.y > 6 && scroller.scrollTop <= 0) { ts.armed = true; dragStart(ts.y); } else if (y < ts.y) { ts = null; return; } else return; }
    if (e.cancelable) e.preventDefault(); dragMove(y);
  }, { passive: false });
  scroller.addEventListener('touchend', () => { if (ts?.armed) dragEnd(); ts = null; });

  document.addEventListener('keydown', e => {
    if (e.target.closest('input,textarea,[contenteditable]')) return;
    if (e.key === ' ' && Player.current && !e.target.closest('button,[role=slider]')) { e.preventDefault(); Player.toggle(); }
    if (e.key === 'Escape' && open && !Sheet.isOpen) hide();
  });

  bus.on('track', () => { render(); syncSpin(true); });
  bus.on('state', state);
  bus.on('time', () => { if (open) tick(); });
  bus.on('library', () => open && render());
  bus.on('airplay', () => open && render());
  bus.on('geo', () => open && render());
  bus.on('offline', () => open && drawDl());
  bus.on('offline-progress', () => open && drawDl());
  bus.on('needs-tap', () => toast('點一下播放鍵繼續'));

  return { show, hide, get isOpen() { return open; }, consumeHistoryClose() { const c = closingViaUI; closingViaUI = false; return c; } };
})();

/* ==========================================================================
   Geo · approximate city by IP (ipwho.is, IP itself never stored),
   precise check-ins by GPS only when the listener taps "check in".
   ========================================================================== */
const CITY_CENTER = { TPE: [25.0330, 121.5654], TNN: [22.9999, 120.2270], LXA: [29.6520, 91.1721], TYO: [35.6762, 139.6503], SHA: [31.2304, 121.4737], BJS: [39.9042, 116.4074], HKG: [22.3193, 114.1694], KYO: [35.0116, 135.7681], LYA: [34.6197, 112.4540], LON: [51.5072, -0.1276], ROM: [41.9028, 12.4964], PAR: [48.8566, 2.3522], DXB: [25.2048, 55.2708], YVR: [49.2827, -123.1207], NYC: [40.7128, -74.0060], HNL: [21.3099, -157.8581], LAX: [34.0522, -118.2437] };
const distKm = (a, b) => { const R = 6371, r = x => x * Math.PI / 180, dLa = r(b[0] - a[0]), dLo = r(b[1] - a[1]); const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a[0])) * Math.cos(r(b[0])) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };

const Geo = (() => {
  const KEY = 'musicetown.citypass.geo.v1';
  let geo = null, theme = null, promise = null, override = null;
  const cached = sess.get(KEY, null); if (cached && Date.now() - Number(cached.ts || 0) < 6 * 3600e3) { geo = cached; theme = match(geo); }
  function match(g) {
    if (!g) return null; const city = norm(g.city).replace(/[^\p{L}\p{N}]+/gu, ' ').trim(); const cc = String(g.country_code || '').toUpperCase();
    if (!city) return null;
    const th = CITY_THEMES.find(t => t.country === cc && (t.aliases || []).some(a => { const x = norm(a); return city === x || city.includes(x) || x.includes(city); }));
    return th ? th.t : null;
  }
  function ensure() {
    if (geo || promise) return promise || Promise.resolve(geo);
    promise = (async () => {
      try {
        const ac = new AbortController(); setTimeout(() => ac.abort(), 6000);
        const r = await fetch('https://ipwho.is/', { mode: 'cors', cache: 'no-store', referrerPolicy: 'no-referrer', signal: ac.signal });
        const raw = await r.json(); if (raw?.success === false) throw new Error('geo');
        geo = { city: String(raw.city || ''), region: String(raw.region || ''), country_code: String(raw.country_code || '').toUpperCase(), ts: Date.now() };
        sess.set(KEY, geo);
      } catch (_) { geo = null; }
      theme = override || match(geo); bus.emit('geo', theme); return geo;
    })();
    return promise;
  }
  function gps() {
    return new Promise((res, rej) => {
      if (!navigator.geolocation) { rej(new Error('unsupported')); return; }
      navigator.geolocation.getCurrentPosition(p => res([p.coords.latitude, p.coords.longitude, p.coords.accuracy]), e => rej(e), { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
    });
  }
  return {
    ensure, gps,
    get theme() { return override || theme; },
    get city() { return override ? THEME_BY_T.get(override)?.city : geo?.city || ''; },
    get resolved() { return !!geo || !!override; },
    confirm(t) { override = t; bus.emit('geo', t); },
    preview(t) { override = t; bus.emit('geo', t); }
  };
})();

/* ==========================================================================

const PassSheet = (() => {

    const sheet = $('.passsheet', root), scroller = $('.passsheet__scroll', root);
    scrollLock.lock(); root.setAttribute('aria-hidden', 'false');
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('is-open')));
    api = { close, sheet, root };
    $('.passsheet__scrim', root).onclick = () => close();
    root.querySelectorAll('[data-x]').forEach(b => b.onclick = () => close());
    // swipe down from the top of the sheet to dismiss
    let d = null;
    sheet.addEventListener('touchstart', e => { if (scroller.scrollTop <= 0 && !e.target.closest('button,a,input')) d = { y: e.touches[0].clientY, t: performance.now(), dy: 0 }; else d = null; }, { passive: true });

    sheet.addEventListener('touchend', () => { if (!d) return; const v = d.dy / Math.max(1, performance.now() - d.t), dy = d.dy; d = null; sheet.style.transition = ''; if (dy > 120 || (v > .6 && dy > 40)) close(); else sheet.style.transform = ''; });
    if (mount) mount(sheet, api);

  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && api) close(); });
  /* the top strip of QR codes that drifts right → left (from the R8 ticket) */

  const rows = list => `<ol class="pass__rows">${list.map((t, i) => `<li data-i="${i}"><em>${pad2(i + 1)}</em><span><b>${esc(t.title)}</b><small>${esc(t.artist || '')}</small></span><i>${icon('play')}</i></li>`).join('')}</ol>`;

const Pass = (() => {

  function hot5(th, seed) {

    if (withPlays.length >= 5) return withPlays.slice().sort((a, b) => b.plays - a.plays).slice(0, 5);
    return seed ? Reco.forLandmark(seed, 5) : (() => { const r = seeded(th.t + 'hot'); return th.tracks.map(t => ({ t, k: r() })).sort((a, b) => a.k - b.k).map(x => x.t).filter((t, i, a) => a.findIndex(y => recKey(y) === recKey(t)) === i).slice(0, 5); })();
  }

    return { id: `city-${th.slug}`, kind: 'city', theme: th.t, code: th.code, title: th.name, city: th.city, cityCn: th.cityCn, where: `${(Geo.city || th.city).toUpperCase()}`, how, no: ticketNo(th.code), issued: today(), localTime: localTimeIn(th.tz), tracks: hot5(th).map(t => t.shareId).filter(Boolean) };
  }
  function issueSpot(lm) {
    const th = THEME_BY_T.get(lm.theme), code = lm.code || th.code;
    return { id: `spot-${lm.id}`, kind: 'spot', theme: th.t, code, title: lm.area || th.name, city: lm.area || th.city, cityCn: lm.areaCn || th.cityCn, area: lm.area || th.name, areaCn: lm.areaCn || th.cityCn, spot: lm.cn, spotEn: lm.name, where: `${lm.lat.toFixed(2)}°, ${lm.lng.toFixed(2)}°`, how: 'GPS', no: ticketNo(code), issued: today(), tracks: Reco.forLandmark(lm, 5).map(t => t.shareId).filter(Boolean) };

        <p class="sheet-note">人在${esc(th.cityCn)}時打開這個目的地，就能收下一張只屬於這座城市的票根，附上當地最常播放的五首歌。城市由連線位置估算；如果你其實就在當地（例如開著 VPN），可以用定位確認。</p>
        <div class="sheet-actions sheet-actions--2"><button class="btn btn--primary" type="button" data-gps aria-label="用定位確認">${icon('location')}定位確認</button><button class="btn" type="button" data-play aria-label="先聽聽 ${esc(th.name)}">${icon('play')}先聽聽</button></div>

      mount(body, s) {
        $('[data-play]', body).onclick = () => { s.close(); Player.playList(Reco.smartShuffle(th.tracks), 0, { kind: 'theme', title: th.name, theme: th.t }); };
        $('[data-gps]', body).onclick = async e => {

/* share a file through the iOS share sheet (Save Image, AirDrop, Messages…) */
async function shareFiles({ blob, name, title = 'musicetown', text = '', url = '', save = false }) {
  if (blob) {
    const file = new File([blob], name, { type: blob.type || 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share(save ? { files: [file], title } : { files: [file], title, text: [text, url].filter(Boolean).join('\n') }); return 'shared'; } catch (e) { if (e?.name === 'AbortError') return 'aborted'; }
    }
    if (save || !url) { downloadBlob(blob, name); return 'downloaded'; }
  }
  return nativeShare({ title, text, url });
}
