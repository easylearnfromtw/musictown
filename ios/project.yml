name: CITYMUS
options:
  bundleIdPrefix: com.easylearnfromtw
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0

targets:
  CITYMUS:
    type: application
    platform: iOS
    sources:
      - path: CITYMUS
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easylearnfromtw.citymus
        CODE_SIGN_ENTITLEMENTS: CITYMUS/CITYMUS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: CITYMUS/Info.plist
    preBuildScripts:
      - name: Prepare CITYMUS App Icon
        script: scripts/prepare_assets.sh
        basedOnDependencyAnalysis: false
    dependencies:
      - target: CITYMUSWidgets
        embed: true

  CITYMUSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CITYMUSWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easylearnfromtw.citymus.widgets
        CODE_SIGN_ENTITLEMENTS: CITYMUSWidgets/CITYMUSWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: CITYMUSWidgets/Info.plist
